<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSE Escuela Raíces Huarpes · Emprender e Innovar</title>
<style>
  :root{
    --bg:#fbfaf6; --texto:#2e2a24; --borde:#e4dccd;
    --acc:#6A9624; --acc-suave:#BFE878; --acc-osc:#4A6B1F; --acc-txt:#4A6B1F; --hov:#eaf5d2;
  }
  /* Turismo: paleta anaranjada (#af5700 · #c06500 · #d27300 · #e48200 · #f69100 · #ffa333 · #ffba6a · #ffd19b · #ffe8cd) */
  body.turismo{ --acc:#c06500; --acc-suave:#ffe8cd; --acc-osc:#af5700; --acc-txt:#8a4500; --hov:#ffe8cd; --borde:#f1d9bb; --bg:#fffaf3; }
  body.comun{ --acc:#2e5d8a; --acc-suave:#dde9f4; --acc-osc:#1d3f61; --acc-txt:#1d3f61; --hov:#e8f0f8; background:linear-gradient(rgba(251,250,246,.92),rgba(251,250,246,.92)),url("img/mural.jpg") center/cover fixed; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Open Sans",Lato,Roboto,Arial,sans-serif;font-size:16px;background:var(--bg);color:var(--texto);line-height:1.65}
  h1,h2,h3,nav,.btn,.logo-txt{font-family:Montserrat,Inter,Poppins,Arial,sans-serif}

  header{background:var(--acc-osc);color:#fff;padding:16px 24px;transition:background-color .25s ease}
  .head-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{width:64px;height:64px;flex:0 0 64px;border-radius:8px;object-fit:cover;background:#fff}
  .logo-txt{flex:1;min-width:220px}
  .logo-txt .nom{font-size:20px;font-weight:700;margin:0;line-height:1.2}
  .logo-txt .sub{font-size:14px;opacity:.9;margin-top:4px}
  .selector{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  .logos-inst{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .logos-inst img{height:56px;width:auto}
  .logos-inst img.pse{height:68px}
  @media(max-width:600px){.logos-inst{flex:1 1 100%;gap:14px}.logos-inst img{height:38px}.logos-inst img.pse{height:46px}}
  .btn-proy{border:2px solid var(--acc);background:#fff;color:var(--acc-osc);padding:9px 16px;border-radius:6px;cursor:pointer;font-size:15px;font-weight:600}
  .btn-proy.activo{background:var(--acc);color:#fff}
  .btn{border:2px solid #fff;background:transparent;color:#fff;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
  .btn:hover{background:rgba(255,255,255,.15)}
  .btn.activo{background:#fff;color:var(--acc-osc)}

  nav{background:#fff;border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:5}
  nav .in{max-width:1080px;margin:0 auto;display:flex;gap:2px;flex-wrap:wrap;padding:0 12px}
  nav button{border:0;background:none;padding:14px 12px;font-size:14px;cursor:pointer;color:var(--texto);border-bottom:3px solid transparent;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
  nav button:hover{background:var(--hov);color:var(--acc-osc);border-bottom-color:var(--acc-suave)}
  nav button.activa{color:var(--acc-osc);border-bottom-color:var(--acc);font-weight:700}
  nav button.activa:hover{border-bottom-color:var(--acc)}

  main{max-width:1080px;margin:0 auto;padding:28px 24px 64px}
  h1.t{font-size:36px;color:var(--acc-osc);margin:6px 0 8px;line-height:1.2}
  h2{font-size:24px;color:var(--acc-osc);margin:26px 0 8px}
  h3{font-size:20px;color:var(--acc);margin:18px 0 6px}
  .lead{font-size:18px;color:#4a443b}
  .tag{display:inline-block;background:var(--acc-suave);color:var(--acc-txt);padding:3px 10px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:8px}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
  .card{background:#fff;border:1px solid var(--borde);border-top:6px solid var(--acc);border-radius:10px;padding:22px;transition:box-shadow .2s, transform .2s, background-color .2s}
  .card[data-go]{cursor:pointer}
  .card[data-go]:hover{box-shadow:0 8px 20px rgba(0,0,0,.12);transform:translateY(-3px);background:var(--hov)}
  .card h3{margin-top:0}

  .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
  .dato{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:14px}
  .dato b{display:block;color:var(--acc-osc);font-family:Montserrat,Arial,sans-serif;font-size:15px}
  .dato span{font-size:14px;color:#554f45}

  .foto{background:#EBE0D5;border:2px dashed var(--acc);border-radius:8px;min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--acc-osc);font-size:14px;margin:14px 0;padding:12px}
  .galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
  .galeria figure{margin:0;background:#fff;border:1px solid var(--borde);border-radius:8px;overflow:hidden}
  .galeria .marco{height:170px;background:var(--acc-suave);display:flex;align-items:center;justify-content:center;color:var(--acc-osc);font-size:13px;text-align:center;padding:10px}
  .galeria .marco img{width:100%;height:100%;object-fit:cover}
  .galeria figcaption{font-size:14px;padding:10px 12px;color:#4a443b}

  .pendiente{background:#fff8e1;border-left:4px solid #d4a017;padding:10px 14px;border-radius:4px;font-size:14px;margin:12px 0}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;background:#fff}
  th,td{border:1px solid var(--borde);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--acc-suave);color:var(--acc-txt)}
  ul,ol{padding-left:22px}
  li{margin-bottom:4px}
  .docs li{margin-bottom:6px}
  .nota{font-size:13px;color:#6b6358}

  .btn-imp{background:var(--acc);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;margin-bottom:8px;transition:background-color .18s ease,transform .18s ease,box-shadow .18s ease}
  .btn-imp:hover{background:var(--acc-osc);transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.18)}
  body.turismo .btn-imp{background:var(--acc-osc)}
  body.turismo .btn-imp:hover{background:var(--acc-txt)}

  /* ---- Inicio: portada, datos y puertas a los proyectos ---- */
  .portada{position:relative;border-radius:14px;overflow:hidden;min-height:380px;display:flex;align-items:flex-end;background:#2b2a26 url("img/escuela.jpg") center 30%/cover}
  .portada::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,24,30,.88) 0%,rgba(20,24,30,.55) 45%,rgba(20,24,30,0) 80%)}
  .portada .txt{position:relative;padding:36px 36px 32px;color:#fff;max-width:760px}
  .portada h1{margin:0 0 10px;font-size:46px;line-height:1.1;color:#fff}
  .portada p{margin:0;font-size:18px;line-height:1.55;color:#f1ede4}
  .datos-fila{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:20px 0 6px;border-bottom:1px solid var(--borde)}
  .datos-fila div{padding:6px 18px 16px 0}
  .datos-fila b{display:block;font-family:Montserrat,Arial,sans-serif;font-size:22px;color:var(--acc-osc);line-height:1.2}
  .datos-fila span{font-size:14px;color:#554f45}
  .puertas{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:14px 0 28px}
  .puerta{display:flex;flex-direction:column;background:#fff;border:1px solid var(--borde);border-radius:12px;overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .2s}
  .puerta:hover{box-shadow:0 10px 24px rgba(0,0,0,.14);transform:translateY(-3px)}
  .puerta img{width:100%;height:190px;object-fit:cover;display:block}
  .puerta .cuerpo{padding:18px 20px 20px;border-top:6px solid var(--c);display:flex;flex-direction:column;flex:1}
  .puerta .ver{margin-top:auto;align-self:flex-start}
  .puerta h3{margin:0 0 6px;font-size:22px;color:var(--co)}
  .puerta p{margin:0 0 14px;color:#4a443b}
  .puerta .ver{display:inline-block;background:var(--c);color:#fff;padding:8px 16px;border-radius:6px;font-weight:600;font-size:15px}
  .puerta.cos{--c:#6A9624;--co:#4A6B1F} .puerta.tur{--c:#b85f00;--co:#8a4500}
  .puerta .ver{background:var(--co)}
  .contexto{max-width:none}
  @media(max-width:700px){.portada{min-height:320px;background-position:74% 40%}.portada .txt{padding:24px 20px}.portada h1{font-size:32px}.portada p{font-size:16px}.datos-fila{grid-template-columns:1fr 1fr}.puertas{grid-template-columns:1fr}}

  /* ---- Menú del sitio (desplegable general) ---- */
  nav{position:sticky}
  .menu-sitio{margin-left:auto;display:flex;align-items:center;gap:9px;font-weight:700;color:var(--acc-osc);border-left:1px solid var(--borde)!important}
  .menu-sitio svg{width:18px;height:18px;transition:transform .2s}
  .menu-sitio[aria-expanded="true"]{background:var(--hov)}
  #panel-menu{position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:3px solid var(--acc);box-shadow:0 14px 28px rgba(0,0,0,.16);max-height:calc(100vh - 110px);overflow:auto}
  #panel-menu[hidden]{display:none}
  #panel-menu .cols{max-width:1080px;margin:0 auto;padding:22px 24px 26px;display:grid;grid-template-columns:.8fr 1.1fr 1.1fr;gap:34px}
  #panel-menu h3{margin:0 0 10px;font-size:15px;padding-bottom:8px;border-bottom:3px solid var(--c);color:var(--co)}
  #panel-menu .c-sitio{--c:#2e5d8a;--co:#1d3f61}
  #panel-menu .c-cos{--c:#6A9624;--co:#4A6B1F}
  #panel-menu .c-tur{--c:#c06500;--co:#8a4500}
  #panel-menu ul{list-style:none;margin:0;padding:0}
  #panel-menu ul ul{padding-left:16px;border-left:2px solid #eee;margin:2px 0 4px 6px}
  #panel-menu li{margin:0}
  #panel-menu a{display:block;padding:6px 8px;border-radius:6px;color:#2e2a24;text-decoration:none;font-size:14.5px;line-height:1.35}
  #panel-menu a:hover,#panel-menu a:focus-visible{background:#f3efe6;color:var(--co)}
  #panel-menu .principal{font-weight:700;color:var(--co)}
  @media(max-width:700px){
    nav .in > button[data-tab],nav .in > .dd{display:none}
    .menu-sitio{margin-left:0;width:100%;justify-content:flex-start;border-left:0!important;padding:14px 18px}
    #panel-menu .cols{grid-template-columns:1fr;gap:22px;padding:16px 18px 22px}
  }

  /* ---- La Escuela ---- */
  .esc-top{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;align-items:stretch;margin:6px 0 34px}
  .esc-top figure{margin:0;border-radius:12px;overflow:hidden;min-height:300px;background:#ddd}
  .esc-top figure img{width:100%;height:100%;object-fit:cover;object-position:35% 50%;display:block}
  .ficha{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:20px 22px;margin:0}
  .ficha div{padding:10px 0;border-bottom:1px solid #efe9dd}
  .ficha div:last-child{border-bottom:0}
  .ficha dt{font-family:Montserrat,Arial,sans-serif;font-size:13px;font-weight:700;color:var(--acc-osc);margin:0 0 2px}
  .ficha dd{margin:0;font-size:15px;line-height:1.45;color:#3a352d}
  .esc-intro{font-size:18px;line-height:1.6;color:#3a352d;margin:0 0 8px}
  .mapa-wrap{margin:10px 0 36px}
  .mapa-wrap iframe{display:block;width:100%;height:420px;border:1px solid var(--borde);border-radius:12px;background:#e9e5dc}
  .mapa-cab{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .btn-mapa{display:inline-block;background:var(--acc-osc);color:#fff;text-decoration:none;padding:9px 16px;border-radius:6px;font-weight:600;font-size:15px}
  .btn-mapa:hover{background:var(--acc)}
  .dos-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:10px}
  .dos-col section{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px 24px}
  .dos-col h2{margin-top:0;font-size:21px}
  .dos-col p{margin:0}
  .dos-col .desafio{border-top:5px solid #b0623a}
  .dos-col .respuesta{border-top:5px solid var(--acc)}
  @media(max-width:760px){.esc-top,.dos-col{grid-template-columns:1fr}.esc-top figure{min-height:220px}.mapa-wrap iframe{height:320px}}

  /* ---- Equipo y contacto ---- */
  .eq-intro{font-size:17px;color:#3a352d;margin:0 0 22px;max-width:none}
  .eq-bloque{margin:0 0 30px}
  .eq-bloque > h2{margin:0 0 12px;font-size:20px}
  .eq-grid{display:flex;flex-wrap:wrap;gap:16px}
  .eq-grid > .eq-card{flex:1 1 300px}
  .eq-card{background:#fff;border:1px solid var(--borde);border-top:5px solid var(--c,#2e5d8a);border-radius:12px;padding:18px 20px}
  .eq-card h3{margin:0 0 4px;font-size:17px;color:var(--co,#1d3f61)}
  .eq-card .inst{font-size:13px;color:#6b6358;margin:0 0 10px}
  .eq-card ul{list-style:none;margin:0;padding:0}
  .eq-card li{padding:6px 0;border-top:1px solid #f0ebe1;font-size:15px;line-height:1.4}
  .eq-card li:first-child{border-top:0}
  .eq-card li span{display:block;font-size:13px;color:#6b6358}
  .eq-card .eq-mail{display:block;font-size:13px;color:var(--co,#1d3f61);text-decoration:none;word-break:break-all;margin-top:2px}
  .eq-card .eq-mail:hover{text-decoration:underline}
  .eq-card.tur{--c:#c06500;--co:#8a4500}
  .eq-card.cos{--c:#6A9624;--co:#4A6B1F}
  .eq-card.esc{--c:#b0623a;--co:#7a3f22}

  /* ---- Sistema Integrado de Gestión (apartado común) ---- */
  .sig-intro{font-size:18px;line-height:1.6;color:#3a352d;margin:0 0 18px}
  .sig-comp{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .sig-comp li{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:18px 20px;display:grid;grid-template-columns:34px 1fr;gap:4px 12px}
  .sig-comp .n{grid-row:span 2;width:34px;height:34px;border-radius:50%;background:var(--acc-suave);color:var(--acc-osc);font:700 16px/34px Montserrat,Arial,sans-serif;text-align:center}
  .sig-comp h3{margin:2px 0 0;font-size:17px;color:var(--acc-osc)}
  .sig-comp p{margin:0;font-size:15px;line-height:1.5;color:#3a352d}
  .sig-comp li.destacado{grid-column:1/-1;border:2px solid var(--acc);background:#f4f8fc}
  .sig-comp li.destacado .n{background:var(--acc);color:#fff}
  .sig-cierre{font-size:15px;color:#4a443b;margin:6px 0 34px}
  .sig-alcance{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 36px}
  .sig-alcance div{background:#fff;border:1px solid var(--borde);border-top:5px solid var(--c);border-radius:12px;padding:18px 20px}
  .sig-alcance h3{margin:0 0 6px;font-size:17px;color:var(--co)}
  .sig-alcance p{margin:0;font-size:15px;line-height:1.5}
  .sig-alcance .cos{--c:#6A9624;--co:#4A6B1F} .sig-alcance .tur{--c:#c06500;--co:#8a4500}
  .sig-nota{font-size:14px;color:#554f45;margin:-22px 0 34px}
  .iso-wrap{overflow-x:auto;border:1px solid var(--borde);border-radius:12px;background:#fff}
  .iso{width:100%;border-collapse:collapse;font-size:14px;line-height:1.45;min-width:760px}
  .iso th,.iso td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid #efe9dd}
  .iso thead th{position:sticky;top:0;background:#f6f3ec;font-family:Montserrat,Arial,sans-serif;font-size:13px}
  .iso thead th.c-com{color:#1d3f61} .iso thead th.c-cos{color:#4A6B1F;border-bottom:3px solid #6A9624} .iso thead th.c-tur{color:#8a4500;border-bottom:3px solid #c06500}
  .iso thead th.c-com{border-bottom:3px solid #2e5d8a}
  .iso td:first-child{font-weight:600;white-space:nowrap;color:#2e2a24}
  .iso td.vacio{color:#b3aa9a}
  .iso tr.grupo td{background:#faf8f3;font:700 12px Montserrat,Arial,sans-serif;color:#6b6358;letter-spacing:.02em;padding:8px 12px}
  @media(max-width:760px){.sig-comp,.sig-alcance{grid-template-columns:1fr}}

  /* ---- Proyectos: portada, tablero y navegación lateral ---- */
  .py-hero{position:relative;border-radius:14px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;background:#333 center/cover;margin:4px 0 0}
  .py-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,18,14,.9),rgba(20,18,14,.45) 55%,rgba(20,18,14,.05))}
  .py-hero .txt{position:relative;padding:30px 32px;color:#fff;max-width:820px}
  .py-hero .tipo{display:inline-block;font-size:13px;font-weight:700;background:var(--acc);padding:3px 10px;border-radius:12px;margin-bottom:10px}
  .py-hero h1{margin:0 0 8px;font-size:40px;line-height:1.1;color:#fff}
  .py-hero p{margin:0;font-size:17px;line-height:1.5;color:#f3eee4}
  .py-datos{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--borde);margin:18px 0 26px}
  .py-datos div{padding:6px 16px 16px 0}
  .py-datos b{display:block;font:700 24px/1.2 Montserrat,Arial,sans-serif;color:var(--acc-osc)}
  .py-datos span{font-size:14px;color:#554f45}
  .py-desc{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
  .py-desc details{margin-top:4px}
  .py-desc summary{cursor:pointer;color:var(--acc-txt);font-weight:700}
  .py-etapas{list-style:none;margin:0;padding:0;counter-reset:e;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:16px 18px}
  .py-etapas h3{margin:0 0 8px;font-size:16px;color:var(--acc-osc)}
  .py-etapas li{counter-increment:e;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:6px 0;font-size:14.5px;line-height:1.4;border-top:1px solid #f0ebe1}
  .py-etapas li:first-of-type{border-top:0}
  .py-etapas li::before{content:counter(e);width:24px;height:24px;border-radius:50%;background:var(--acc-suave);color:var(--acc-osc);font:700 12px/24px Montserrat,Arial,sans-serif;text-align:center}
  .tablero{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:10px}
  .col-t h3{margin:0 0 4px;font-size:16px;color:var(--acc-osc)}
  .doc-c{display:block;background:#fff;border:1px solid var(--borde);border-left:5px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:var(--texto);transition:box-shadow .15s,transform .15s}
  .doc-c:hover,.doc-c:focus-visible{box-shadow:0 6px 16px rgba(0,0,0,.1);transform:translateY(-2px)}
  .doc-c b{display:block;font-size:14.5px;line-height:1.35;color:var(--acc-osc)}
  .doc-c small{display:block;font-size:12.5px;color:#6b6358;margin-top:3px}
  .doc-c.comun{border-left-color:#2e5d8a}.doc-c.comun b{color:#1d3f61}
  .py-layout{display:grid;grid-template-columns:240px 1fr;gap:30px;align-items:start}
  .py-lado{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px 10px}
  .py-lado .volver-p{display:block;font-weight:700;color:var(--acc-osc);text-decoration:none;padding:4px 8px 10px;border-bottom:1px solid #efe9dd;margin-bottom:6px;font-size:14px}
  .py-lado h4{margin:10px 8px 4px;font:700 12px Montserrat,Arial,sans-serif;color:#7a7266}
  .py-lado a.it{display:block;padding:6px 8px;border-radius:6px;font-size:13.5px;line-height:1.3;color:#3a352d;text-decoration:none;border-left:3px solid transparent}
  .py-lado a.it:hover{background:var(--hov)}
  .py-lado a.it.actual{background:var(--acc-suave);color:var(--acc-osc);font-weight:700;border-left-color:var(--acc)}
  .py-sel{display:none}
  .py-sel .volver-m{display:block;font-weight:700;color:var(--acc-osc);text-decoration:none;margin-bottom:12px;font-size:15px}
  .py-sel label{display:block}
  .py-pasos{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:18px;border-top:1px solid var(--borde)}
  .py-pasos a{display:block;max-width:48%;text-decoration:none;background:#fff;border:1px solid var(--borde);border-radius:10px;padding:10px 14px;color:var(--acc-osc)}
  .py-pasos a small{display:block;font-size:12px;color:#7a7266}

  .half{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:14px;padding:clamp(40px,12vh,120px) clamp(24px,6vw,84px) 56px;position:relative;overflow:hidden}

  /* =====================================================================
     ESTILO "MOSAICO": identidad tomada de la escuela (mural de la wiphala,
     piso de mosaicos, carteles pintados a mano) y del secano lavallino.
     ===================================================================== */
  @font-face{font-family:"Archivo";src:url("fonts/archivo.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
  @font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-400.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-400i.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
  @font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-700.woff2") format("woff2");font-weight:700;font-display:swap}
  :root{
    --tinta:#1F2A33; --arena:#EDE4D3; --linea:#D9D2C4; --ladrillo:#C23B26; --ocre:#B8730F; --jarilla:#55702A; --cielo:#2B5F8A;
    --bg:#ffffff; --texto:#1F2A33; --borde:#D9D2C4;
    --acc:#55702A; --acc-suave:#E6EBD9; --acc-osc:#3E5420; --acc-txt:#3E5420; --hov:#F1F4EA;
    --m1:var(--jarilla); --m2:var(--ladrillo); --m3:var(--ocre); --m4:var(--cielo);
  }
  body.turismo{--acc:#B8730F;--acc-suave:#F5E7CF;--acc-osc:#7E4E08;--acc-txt:#7E4E08;--hov:#FBF3E6;--borde:#D9D2C4;--bg:#ffffff;--m1:var(--ocre);--m2:var(--ladrillo);--m3:var(--jarilla);--m4:var(--cielo)}
  body.comun{--acc:#2B5F8A;--acc-suave:#DDE8F2;--acc-osc:#1D4467;--acc-txt:#1D4467;--hov:#EEF4F9;background:#fff;--m1:var(--cielo);--m2:var(--ladrillo);--m3:var(--ocre);--m4:var(--jarilla)}
  body{font-family:"Atkinson Hyperlegible",Arial,sans-serif;font-size:17px;line-height:1.6;color:var(--tinta);background:#fff}
  h1,h2,h3,h4,nav,.btn,.logo-txt,.btn-imp,.ver,.btn-mapa,.datos-fila b,.py-datos b,.pdca-l{font-family:"Archivo",Arial,sans-serif}
  h1.t,.portada h1,.py-hero h1{font-stretch:115%;font-weight:800;letter-spacing:-.01em;color:var(--tinta)}
  h1.t{font-size:44px;line-height:1.05;margin:4px 0 14px}
  h2{font-stretch:110%;font-weight:750;font-size:26px;line-height:1.15;color:var(--tinta);margin:40px 0 12px;display:flex;align-items:center;gap:12px}
  h2::before{content:"";flex:0 0 18px;height:18px;background:conic-gradient(var(--m1) 0 25%,var(--m2) 0 50%,var(--m3) 0 75%,var(--m4) 0)}
  h3{font-stretch:100%;font-weight:700;color:var(--acc-osc)}
  .lead{color:#3d4852}
  /* encabezado y barra: siempre tinta, la identidad del proyecto va en el contenido */
  header,body.turismo header{background:var(--tinta)}
  .logo-txt .nom{font-family:"Archivo",Arial,sans-serif;font-stretch:115%;font-weight:800;letter-spacing:0}
  nav{border-bottom:1px solid var(--linea)}
  nav button{font-size:15px;font-weight:600;color:var(--tinta);border-bottom-width:4px}
  nav button:hover{background:transparent;color:var(--acc-osc);border-bottom-color:var(--linea)}
  nav button.activa{color:var(--tinta);border-bottom-color:var(--acc)}
  .menu-sitio{border-left:1px solid var(--linea)!important}
  /* fuera tarjetas genéricas: sin sombras, sin franjas arriba, esquinas rectas */
  .card,.dato,.puerta,.doc-c,.eq-card,.sig-comp li,.ficha,.dos-col section,.sig-alcance div,.pdca-cab,.py-etapas,.py-lado,.py-pasos a{border-radius:2px!important;box-shadow:none!important}
  .card:hover,.puerta:hover,.doc-c:hover{transform:none!important;box-shadow:none!important}
  .card{border:0;border-top:2px solid var(--tinta);padding:16px 0 0;background:transparent}
  .eq-card{border:0;border-top:2px solid var(--c,var(--tinta));padding:14px 0 0;background:transparent}
  .eq-card li{border-top:1px solid var(--linea)}
  .dos-col section,.sig-alcance div{border:0;border-top:2px solid var(--c,var(--tinta));background:transparent;padding:14px 0 0}
  .dos-col .desafio{--c:var(--ladrillo)}.dos-col .respuesta{--c:var(--cielo)}
  .ficha{border:0;background:var(--arena);padding:20px 22px}
  .ficha div{border-bottom-color:#d6cbb6}
  .tag{display:none}
  .btn-imp,.btn-mapa,.puerta .ver{border-radius:2px;font-weight:700;font-stretch:105%}
  .btn-imp{background:transparent;color:var(--tinta);border:1.5px solid var(--tinta);padding:7px 14px}
  .btn-imp:hover{background:var(--tinta);color:#fff;transform:none;box-shadow:none}
  body.turismo .btn-imp{background:transparent}
  /* Inicio: foto al lado del título, sin degradado encima */
  .portada{display:grid;grid-template-columns:1fr 1.15fr;gap:0;min-height:0;background:var(--arena);border-radius:0;overflow:visible;align-items:stretch}
  .portada::before{display:none}
  .portada .txt{position:static;padding:44px 40px 40px 0;margin-left:0;color:var(--tinta);max-width:none;background:#fff;display:flex;flex-direction:column;justify-content:flex-end}
  .portada h1{font-size:64px;line-height:.98;margin:0 0 18px}
  .portada p{color:#3d4852;font-size:19px}
  .portada img{width:100%;height:100%;min-height:420px;object-fit:cover;display:block}
  .datos-fila{border-top:2px solid var(--tinta);border-bottom:0;margin-top:0;padding-top:14px}
  .datos-fila b,.py-datos b{font-stretch:112%;font-weight:800;color:var(--tinta)}
  .puertas{gap:28px}
  .puerta{border:0;background:transparent}
  .puerta img{height:240px}
  .puerta .cuerpo{border-top:0;padding:16px 0 0;position:relative}
  .puerta .cuerpo::before{content:"";position:absolute;top:-6px;left:0;width:64px;height:6px;background:var(--c)}
  .puerta .ver{background:var(--tinta)}
  .puerta:hover h3{text-decoration:underline;text-underline-offset:4px}
  /* Portada de proyecto */
  .py-hero{display:grid;align-items:stretch;grid-template-columns:1fr 1.15fr;min-height:0;background:var(--arena)!important;border-radius:0;overflow:visible}
  .py-hero::before{display:none}
  .py-hero .txt{position:static;color:var(--tinta);background:#fff;padding:36px 36px 34px 0;display:flex;flex-direction:column;justify-content:flex-end;max-width:none}
  .py-hero .tipo{background:none;color:var(--acc-osc);padding:0;font-size:15px;font-family:"Archivo",Arial,sans-serif;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .py-hero .tipo::before{content:"";width:18px;height:18px;background:conic-gradient(var(--m1) 0 25%,var(--m2) 0 50%,var(--m3) 0 75%,var(--m4) 0)}
  .py-hero h1{font-size:54px;line-height:1;color:var(--tinta)}
  .py-hero p{color:#3d4852}
  .py-hero img{width:100%;height:100%;min-height:360px;object-fit:cover;display:block}
  .py-datos{border-top:2px solid var(--tinta);border-bottom:0;padding-top:14px;margin-top:0}
  .py-etapas{border:0;background:var(--arena);padding:18px 20px}
  .py-etapas li{border-top-color:#d6cbb6}
  .py-etapas li::before{border-radius:0;background:var(--acc);color:#fff}
  .pdca-cab{background:transparent;border:0;border-top:2px solid var(--tinta);padding:12px 0 0;min-height:0}
  .pdca-l{border-radius:0;background:var(--acc)}
  .doc-c{border:0;border-left:4px solid var(--acc);background:#F7F5F0;border-radius:0!important}
  .doc-c:hover,.doc-c:focus-visible{background:var(--hov)}
  .doc-c.comun{border-left-color:var(--cielo)}
  .py-lado{border:0;border-right:1px solid var(--linea);background:transparent;padding:4px 14px 4px 0}
  .py-lado a.it{border-radius:0}
  table th{background:var(--arena)!important}
  .sig-comp li{border:0;border-top:2px solid var(--tinta);background:transparent;padding:14px 0 0}
  .sig-comp li.destacado{border:0;background:var(--arena);padding:20px 22px}
  .sig-comp .n{border-radius:0}
  @media(max-width:760px){
    .portada,.py-hero{grid-template-columns:1fr}
    .portada img,.py-hero img{min-height:240px;height:240px;order:-1}
    .portada .txt,.py-hero .txt{padding:22px 0 18px}
    .portada h1{font-size:40px}.py-hero h1{font-size:36px}h1.t{font-size:34px}
  }

  /* ---- Menú como panel lateral ---- */
  #panel-menu{position:fixed;top:0;right:0;bottom:0;left:auto;width:min(400px,92vw);max-height:none;z-index:40;background:#fff;border:0;border-left:1px solid var(--linea);box-shadow:none;overflow-y:auto;animation:pm-entra .22s ease-out}
  @keyframes pm-entra{from{transform:translateX(100%)}to{transform:none}}
  body.menu-abierto{overflow:hidden}
  body.menu-abierto #tabs{z-index:41}
  body.menu-abierto #tabs::before{content:"";position:fixed;inset:0;background:rgba(31,42,51,.5);z-index:39}
  #panel-menu .pm-cab{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:var(--tinta);color:#fff;font:800 20px "Archivo",Arial,sans-serif;font-stretch:115%}
  #panel-menu .pm-cerrar{background:none;border:1.5px solid #fff;color:#fff;font:700 14px "Archivo",Arial,sans-serif;padding:6px 12px;border-radius:2px;cursor:pointer}
  #panel-menu .pm-cerrar:hover{background:#fff;color:var(--tinta)}
  #panel-menu .cols{display:block;max-width:none;padding:8px 22px 30px}
  #panel-menu .cols > div{padding:18px 0 4px}
  #panel-menu h3{font-family:"Archivo",Arial,sans-serif;font-stretch:110%;font-size:16px;border-bottom-width:2px}
  #panel-menu a{font-size:15.5px;border-radius:0}
  @media (prefers-reduced-motion:reduce){#panel-menu{animation:none}}
  @media(max-width:700px){#panel-menu{width:100vw}}

  /* A · Mosaico sobrio: solo el cuadrito en los títulos */
  header{border-bottom:0}

  /* ===== Turismo · animación sobre el afiche original del Circuito Renacer ===== */
  #tur-anim .escena{background:#f5e8cc;border:1px solid var(--borde);border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(65,45,19,.11)}
  #tur-anim .escena svg{display:block;width:100%;max-width:100%;height:auto;margin:0}
  #tur-anim .tur-anim-caption{margin:10px 0 6px;font-size:14px;line-height:1.5;color:#5b4d3b}
  #tur-anim .tur-leyenda{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:7px 0 12px}
  #tur-anim .tur-leyenda span{background:#fff9ed;border:1px solid #e3d4bc;border-radius:100px;padding:4px 10px;font-size:13px;color:#59442a}
  #tur-anim .tur-leyenda b{color:#754311}
  #tur-anim .anim-track{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
  #tur-anim .anim-paso{font-family:inherit;line-height:1.4;text-align:left;color:inherit}
  #tur-anim .anim-paso.activo-anim{color:#fff}
  #tur-anim .anim-paso:focus-visible{outline:3px solid #b8730f;outline-offset:3px}
  #tur-anim .tur-caminante{stroke-linecap:round;stroke-linejoin:round}
  #tur-anim .tur-brazo-a{transform-box:fill-box;transform-origin:center top}
  #tur-anim .tur-brazo-b{transform-box:fill-box;transform-origin:center top}
  #tur-anim .tur-pierna-a{transform-box:fill-box;transform-origin:center top}
  #tur-anim .tur-pierna-b{transform-box:fill-box;transform-origin:center top}
  #tur-anim .tur-caminando .tur-brazo-a{animation:tur-brazo-a .55s ease-in-out infinite alternate}
  #tur-anim .tur-caminando .tur-brazo-b{animation:tur-brazo-b .55s ease-in-out infinite alternate}
  #tur-anim .tur-caminando .tur-pierna-a{animation:tur-pierna-a .55s ease-in-out infinite alternate}
  #tur-anim .tur-caminando .tur-pierna-b{animation:tur-pierna-b .55s ease-in-out infinite alternate}
  #tur-anim .tur-caminando .tur-caminante:nth-of-type(2) *{animation-delay:-.18s}
  #tur-anim .tur-caminando .tur-caminante:nth-of-type(3) *{animation-delay:-.35s}
  @keyframes tur-brazo-a{from{transform:rotate(-24deg)}to{transform:rotate(26deg)}}
  @keyframes tur-brazo-b{from{transform:rotate(26deg)}to{transform:rotate(-24deg)}}
  @keyframes tur-pierna-a{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
  @keyframes tur-pierna-b{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
  @media(max-width:650px){#tur-anim .escena.tur-escena-renacer{overflow-x:auto}#tur-anim .escena.tur-escena-renacer svg{min-width:690px}}
  @media(max-width:600px){#tur-anim .tur-anim-caption{font-size:13px}#tur-anim .anim-track{grid-template-columns:1fr 1fr}#tur-anim .anim-paso{font-size:12px;padding:7px}}
  @media(max-width:380px){#tur-anim .anim-track{grid-template-columns:1fr}}
  /* Comparación dinámica entre datos ingresados y límites del Renacer. */
  #tur-anim .tur-evaluacion{margin:16px 0 18px;border:1px solid #e5d5ba;border-radius:12px;background:#fffdf8;overflow:hidden}
  #tur-anim .tur-evaluacion-cab{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:13px 16px;background:#fbf3e5;border-bottom:1px solid #e8d9c2}
  #tur-anim .tur-evaluacion-cab h3{font-size:17px;margin:0;color:#7a4118}
  #tur-anim .tur-estado-general{font-size:13px;font-weight:800;border-radius:100px;padding:5px 12px;letter-spacing:.01em}
  #tur-anim .tur-estado-general.apto{background:#e1f2e1;color:#24652a}
  #tur-anim .tur-estado-general.no-apto{background:#fbe1da;color:#992e1c}
  #tur-anim .tur-evaluacion .tscroll{margin:0}
  #tur-anim .tur-evaluacion table{margin:0;border:0;min-width:590px}
  #tur-anim .tur-evaluacion th{background:#fff6e8;font-size:13px;color:#633d22}
  #tur-anim .tur-evaluacion td{font-size:13.5px;padding:10px 12px;vertical-align:middle}
  #tur-anim .tur-evaluacion th,#tur-anim .tur-evaluacion td{border-left:0;border-right:0}
  #tur-anim .tur-estado-item{font-size:12px;font-weight:800;white-space:nowrap}
  #tur-anim .tur-estado-item.apto{color:#2c7132}
  #tur-anim .tur-estado-item.no-apto{color:#9b3424}
  #tur-anim .tur-evaluacion .tur-explicacion{margin:0;padding:11px 16px 15px;font-size:13px;line-height:1.6;color:#594b3a}
  @media(prefers-reduced-motion:reduce){#tur-anim .tur-caminando *{animation:none!important}#tur-anim .anim-paso{transition:none!important}}
  /* ---- Voces de los estudiantes ---- */
  .voces-intro{margin:-4px 0 18px;color:#3d4852}
  #contenido ol{padding-left:30px}
  .voces{display:flex;flex-direction:column;gap:28px;margin-bottom:10px}
  .voz{margin:0;display:grid;grid-template-columns:72px minmax(0,780px);gap:0 18px;align-items:start}
  .voz figcaption{grid-column:1;grid-row:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:4px}
  .voz blockquote{grid-column:2;grid-row:1;position:relative;margin:0;padding:20px 24px;background:var(--vb);border-radius:2px 14px 14px 14px;font-size:17px;line-height:1.6;color:var(--tinta)}
  .voz blockquote::after{content:"";position:absolute;left:-12px;top:0;border-right:12px solid var(--vb);border-bottom:14px solid transparent}
  .voz blockquote p{margin:0 0 .8em}.voz blockquote p:last-child{margin-bottom:0}
  .voz .ava{flex:0 0 64px;width:64px;height:64px;display:block}
  .voz .ava svg{width:64px;height:64px;display:block}
  .voz .ini{width:52px;height:52px;background:var(--vc);color:#fff;font:800 16px/52px "Archivo",Arial,sans-serif;text-align:center}
  .voz figcaption b{display:block;font-family:"Archivo",Arial,sans-serif;font-size:13.5px;line-height:1.2}
  .voz figcaption small{display:block;font-size:12px;color:#5b6570;line-height:1.25}
  .voz.cosmetica{grid-template-columns:minmax(0,780px) 72px;justify-content:end}
  .voz.cosmetica figcaption{grid-column:2}.voz.cosmetica blockquote{grid-column:1;border-radius:14px 2px 14px 14px}
  .voz.cosmetica blockquote::after{left:auto;right:-12px;border-right:0;border-left:12px solid var(--vb)}
  @media(max-width:640px){
    .voz,.voz.cosmetica{grid-template-columns:1fr}
    .voz figcaption,.voz.cosmetica figcaption{grid-column:1;grid-row:1;flex-direction:row;text-align:left;margin-bottom:12px}
    .voz blockquote,.voz.cosmetica blockquote{grid-column:1;grid-row:2;border-radius:2px 14px 14px 14px}
    .voz blockquote::after,.voz.cosmetica blockquote::after{left:22px;right:auto;top:-12px;border:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:12px solid var(--vb)}
  }
  .voz.turismo{--vb:#F5E7CF;--vc:#B8730F}
  .voz.cosmetica{--vb:#E6EBD9;--vc:#55702A}
  /* ===== Cosmética · animación de la elaboración ===== */
  #escena{display:grid;grid-template-columns:1.55fr 1fr;gap:0;background:#fff;border:1px solid var(--linea)}
  #escena .ca-cuadro{position:relative;min-height:260px}
  #escena .ca-cuadro svg{position:absolute;inset:0;display:block;width:100%;height:100%}
  #escena .ca-info{padding:22px 24px;border-left:1px solid var(--linea);animation:ca-entra .45s ease-out}
  #escena .ca-fase{display:block;font:700 13px "Archivo",Arial,sans-serif;color:var(--acc-osc);margin-bottom:6px}
  #escena .ca-info h3{margin:0 0 14px;font-size:22px;line-height:1.2;color:var(--tinta)}
  #escena dl{margin:0}#escena dl div{padding:9px 0;border-top:1px solid var(--linea)}
  #escena dt{font:700 12.5px "Archivo",Arial,sans-serif;color:#5b6570}#escena dd{margin:2px 0 0;font-size:15px;line-height:1.45}
  .ca-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
  .ca-ctrl button{font:700 14px "Archivo",Arial,sans-serif;border:1.5px solid var(--tinta);background:#fff;color:var(--tinta);border-radius:2px;padding:7px 14px;cursor:pointer}

/* ---------- Simulación ---------- */
function simRun(){
  const el=document.getElementById("simout"); if(!el) return;
  if(proy==="cosmetica"){
    const n=Math.max(1,Math.round(+document.getElementById("nenv").value||12));
    const m=n*50, v=m*500/600, c=m/6, o=m/6, a=m*0.01;
    el.innerHTML=`<table><tr><th>Componente</th><th>Masa para ${n} envases (${m} g)</th></tr>
      <tr><td>Vaselina (base)</td><td>${v.toFixed(0)} g</td></tr>
      <tr><td>Cera de abeja (espesante)</td><td>${c.toFixed(0)} g</td></tr>
      <tr><td>Oleato de jarilla</td><td>${o.toFixed(0)} g</td></tr>
      <tr><td>Aroma de limón (máx. 1 % m/m)</td><td>hasta ${a.toFixed(1)} g</td></tr></table>
      <p class="nota">Proporción de la fórmula de referencia 500 : 100 : 100 g. Pesar siempre en gramos.</p>`;
    return;
  }
  if(document.getElementById("tur-circ")){ simTur(); return; }
  const g=Math.max(1,+document.getElementById("ngr").value||20);
  const paradas=[["Recepción y charla de seguridad",10],["Parada 1: cartelería interpretativa",15],["Parada 2: flora y paisaje",15],["Parada 3: reloj solar y mural (propuesta)",15],["Cierre, preguntas y encuesta de satisfacción",10]];
  let t=9*60, filas="";
  paradas.forEach(([nom,min])=>{ const h=String(Math.floor(t/60)).padStart(2,"0"), mm=String(t%60).padStart(2,"0"); filas+=`<tr><td>${h}:${mm}</td><td>${nom}</td><td>${min} min</td></tr>`; t+=min; });
  const total=paradas.reduce((s,x)=>s+x[1],0);
  el.innerHTML=`<table><tr><th>Horario simulado</th><th>Actividad</th><th>Duración</th></tr>${filas}</table>
    <p><b>Duración total:</b> ${total} min. <b>Guías sugeridos:</b> ${Math.ceil(g/15)} (criterio de 1 guía cada 15 personas, a validar en la salida piloto).</p>`;
}

/* ---------- Animación de la simulación ---------- */
let animTimer = null, animIdx = 0;
const PASOS_TUR = ["Recepción y charla de seguridad","Parada 1: cartelería interpretativa","Parada 2: flora y paisaje","Parada 3: reloj solar y mural (propuesta)","Cierre, preguntas y encuesta de satisfacción"];
function animSteps(){ return proy==="cosmetica" ? P.cosmetica.proceso : PASOS_TUR; }
function animInit(){
  clearInterval(animTimer); animTimer = null; animIdx = 0;
  const el = document.getElementById("anim"); if(!el) return;
  const est = proy==="cosmetica"
    ? "Duración orientativa: elaboración en un día, más 1 semana de maceración y 2 de reposo del oleato."
    : "Recorrido guiado en una sola jornada. Los tiempos se ajustan en la salida piloto.";
  el.innerHTML = `<div class="anim-ctrl noprint"><button class="btn-imp" id="anim-play">Reproducir</button><button class="btn-imp" id="anim-reset">Reiniciar</button></div>
    <div class="anim-track">${animSteps().map((s,i)=>`<div class="anim-paso" data-i="${i}"><span class="num">${i+1}</span>${s}</div>`).join("")}</div>
    <div class="anim-barra"><div id="anim-bar"></div></div>
    <p class="nota" id="anim-msg"></p><p class="nota">${est}</p>`;
  document.getElementById("anim-play").onclick = animToggle;
  document.getElementById("anim-reset").onclick = animReset;
  document.querySelectorAll(".anim-paso").forEach(p=>p.onclick=()=>{ animIdx = +p.dataset.i; animPaint(); });
  animPaint();
}
function animPaint(){
  const pasos = animSteps(), n = pasos.length;
  const el = document.getElementById("anim-bar"); if(!el){ clearInterval(animTimer); animTimer=null; return; }
  document.querySelectorAll(".anim-paso").forEach((p,i)=>{ p.classList.toggle("hecho", i<animIdx); p.classList.toggle("activo-anim", i===animIdx); });
  el.style.width = (animIdx/n*100)+"%";
  document.getElementById("anim-msg").textContent = animIdx<n ? "Paso actual: "+pasos[animIdx] : "Proceso completo. Reinicia para repetir.";
}
function animToggle(){
  const btn = document.getElementById("anim-play");
  if(animTimer){ clearInterval(animTimer); animTimer=null; btn.textContent="Reproducir"; return; }
  const n = animSteps().length;
  if(animIdx>=n) animIdx = 0;
  btn.textContent = "Pausar";
  animPaint();
  animTimer = setInterval(()=>{
    animIdx++; animPaint();
    if(animIdx>=n){ clearInterval(animTimer); animTimer=null; btn.textContent="Reproducir"; }
  }, 1800);
}
function animReset(){
  clearInterval(animTimer); animTimer=null; animIdx=0;
  const b = document.getElementById("anim-play"); if(b) b.textContent="Reproducir";
  animPaint();
}

function cosIr(i){ const n=P.cosmetica.proceso.length; cosIdx=Math.max(0,Math.min(n-1,i)); cosPaint(); }
function cosToggle(){
  const b = document.getElementById('cos-play');
  if(cosTimer){ clearInterval(cosTimer); cosTimer = null; b.textContent = 'Reproducir'; return; }
  if(cosIdx >= P.cosmetica.proceso.length-1) cosIdx = 0;
  b.textContent = 'Pausar'; cosPaint();
  cosTimer = setInterval(()=>{
    if(cosIdx >= P.cosmetica.proceso.length-1){ clearInterval(cosTimer); cosTimer = null; b.textContent = 'Reproducir'; return; }
    cosIdx++; cosPaint();

}
function cosReset(){ clearInterval(cosTimer); cosTimer = null; cosIdx = 0; const b = document.getElementById('cos-play'); if(b) b.textContent = 'Reproducir'; cosPaint(); }
function cosInit(){
  clearInterval(cosTimer); cosTimer = null; cosIdx = 0;

  L.querySelectorAll('button').forEach(p=>p.onclick = ()=>cosIr(+p.dataset.i));
  document.getElementById('cos-play').onclick = cosToggle;
  document.getElementById('cos-prev').onclick = ()=>cosIr(cosIdx-1);
  document.getElementById('cos-next').onclick = ()=>cosIr(cosIdx+1);
  cosPaint();
}

/* ---------- Navegación con fade rápido entre ventanas ---------- */
let pend = null, navTimer = null;
function aplicar(){
  tab = pend.tab; proy = pend.proy; sub = pend.sub; pend = null;
  render();
  const cont = document.getElementById("contenido");
  requestAnimationFrame(()=>requestAnimationFrame(()=>cont.classList.remove("saliendo")));
}
function ir(cambios){
  const nuevo = Object.assign({tab, proy, sub}, pend || {}, cambios);
  if(!pend && nuevo.tab===tab && nuevo.proy===proy && nuevo.sub===sub) return;
  pend = nuevo;
  clearTimeout(navTimer);
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){ aplicar(); return; }
  document.getElementById("contenido").classList.add("saliendo");
  navTimer = setTimeout(aplicar, 130);
}

    ir(Object.assign({tab:t, sub:s || null}, pr ? {proy:pr} : {}));

  const b = e.target.closest("#tabs button[data-tab]");

});

/* El afiche y el panel de control consultan exactamente la misma evaluación. */
function turNumeroIngreso(id){
  const input=document.getElementById(id);
  if(!input || input.value.trim()==='') return NaN;
  return Number(input.value);
}
function turEvaluarRenacer(){
  const visitantesIngresados=turNumeroIngreso('ngr');
  const temp=turNumeroIngreso('tur-temp');
  const viento=turNumeroIngreso('tur-viento');
  const agua=turNumeroIngreso('tur-agua');
  const cantidadValida=Number.isInteger(visitantesIngresados)&&visitantesIngresados>=1;
  const visitantes=cantidadValida?visitantesIngresados:0;
  const guias=visitantes?Math.ceil(visitantes/STD.nMax):0;
  const porGuia=guias?Math.ceil(visitantes/guias):0;
  const minimo=visitantes?(visitantes+guias)*STD.aguaMl/1000:NaN;
  const cupoOK=cantidadValida && visitantes>=STD.nMin && Math.floor(visitantes/guias)>=STD.nMin && porGuia<=STD.nMax;
  const tempOK=Number.isFinite(temp)&&temp<STD.tMax;
  const vientoOK=Number.isFinite(viento)&&viento>=0&&viento<STD.vMax;
  const aguaOK=Number.isFinite(agua)&&Number.isFinite(minimo)&&agua>=minimo;
  return {
    visitantesIngresados,visitantes,guias,porGuia,temp,viento,agua,minimo,
    cupoOK,tempOK,vientoOK,aguaOK,
    aceptado:cupoOK&&tempOK&&vientoOK&&aguaOK

function simTur(){

  const evaluacionRenacer=turEvaluarRenacer();
  const g = evaluacionRenacer.visitantes;
  const t0 = +document.getElementById("tur-turno").value;
  const temp = evaluacionRenacer.temp;
  const vto = evaluacionRenacer.viento;
  const agua = evaluacionRenacer.agua;
  const guias = evaluacionRenacer.guias, sub = evaluacionRenacer.porGuia;
  const aguaReq = evaluacionRenacer.minimo;
  const clima = evaluacionRenacer.tempOK && evaluacionRenacer.vientoOK;
  const hidr = evaluacionRenacer.aguaOK;
  let t=t0, filas="";
  C.paradas.forEach(([nom,min,nota])=>{ filas+=`<tr><td>${hhmm(t)}</td><td>${nom}</td><td>${min} min</td><td class="nota">${nota||""}</td></tr>`; t+=min; });
  const total=C.paradas.reduce((s,x)=>s+x[1],0);
  const enStd = total>=STD.tNom-STD.tTol && total<=STD.tNom+STD.tTol;
  const fin = t0===570 ? 660 : 1110;
  const ok = (b,si,no) => `<span class="${b?"ok":"no"}">${b?"✔ "+si:"✖ "+no}</span>`;
  const libera = turCirc==='renacer' ? evaluacionRenacer.aceptado : clima && hidr;
  el.innerHTML = `<p class="lead" style="margin:6px 0"><b>${C.nombre}</b> · <span class="nota">${C.estado}</span></p>
    ${tblT(["Horario","Actividad","Duración","Control"],[])}`.replace("</table></div>","")+filas+`</table></div>
    <div class="kpis">
      <div class="kpi"><b>${total} min</b><span>Duración total · fin ${hhmm(t)}</span></div>
      <div class="kpi"><b>${guias}</b><span>Guías (${guias>1?guias+" subgrupos de hasta "+sub:"1 grupo"})</span></div>
      <div class="kpi"><b>${aguaReq.toFixed(1)} L</b><span>Agua requerida (${g} visitantes + ${guias} guías)</span></div>
      <div class="kpi ${libera?"kpi-ok":"kpi-no"}"><b>${libera?"PASO":"NO PASO"}</b><span>${turCirc==='renacer'?'Evaluación de datos del PCC-1 (sujeta a checklist)':'Liberación de la salida (PCC-1)'}</span></div>
    </div>
    ${turCirc==='renacer'
      ? '<p class="nota">La comparación entre valores ingresados y límites, con su aceptación o rechazo, aparece junto al afiche animado.</p>'
      : `<ul class="checks">
      <li>${ok(clima,`Clima apto (${temp} °C, ${vto} km/h)`,`Suspender: ${temp>=STD.tMax?"temperatura ≥ 38 °C ":""}${vto>=STD.vMax?"viento ≥ 50 km/h (Zonda)":""} — aplicar protocolo de contingencias climáticas`)}</li>
      <li>${ok(hidr,`Agua suficiente (${agua} L ≥ ${aguaReq.toFixed(1)} L)`,`Faltan ${(aguaReq-agua).toFixed(1)} L de agua: reponer antes de salir`)}</li>
      <li>${ok(g<=STD.nMax,`Grupo dentro del cupo (${g} ≤ 15)`,`${g} personas: dividir en ${guias} subgrupos con un guía cada uno`)}</li>
      ${g<STD.nMin?`<li><span class="parcial">⚠ Grupo menor al mínimo de ${STD.nMin} personas: evaluar unirlo a otro turno</span></li>`:""}
      <li>${ok(enStd,`Ciclo dentro de ${STD.tNom} ± ${STD.tTol} min`,`Ciclo de ${total} min fuera del estándar del Renacer (${STD.tNom-STD.tTol}–${STD.tNom+STD.tTol} min): se rige por su propio tiempo estándar`)}</li>
      <li>${ok(t<=fin,`Termina dentro de la ventana operativa (hasta ${hhmm(fin)})`,`Termina a las ${hhmm(t)}, fuera de la ventana operativa (hasta ${hhmm(fin)})`)}</li>
      </ul>`}
    <p class="nota">Tiempos por parada del tiempo estándar inicial. Se ajustan con las planillas R-ST-05 de las salidas piloto.</p>`;
  turAnimInit();
}

function turStop(){
  if(turTimer!==null) cancelAnimationFrame(turTimer);
  turTimer=null;turPlaying=false;turMoving=false;turPhase=0;turRest=0;turFrameTime=0;
  const b=document.getElementById('tur-play');if(b) b.textContent='Reproducir';
  const p=document.getElementById('tur-walkers');if(p) p.classList.remove('tur-caminando');
}
function turPlace(x,y){
  const p=document.getElementById('tur-walkers');
  if(p) p.setAttribute('transform',`translate(${x} ${y})`);
}
function turPaint(){
  const p=CIRCUITOS[turCirc].paradas,n=p.length;
  if(!document.getElementById('tur-walkers')){turStop();return;}
  turPlace(...turPos(Math.min(turIdx,n-1),n));
  document.querySelectorAll('#tur-anim .anim-paso').forEach((x,i)=>{
    x.classList.toggle('hecho',i<turIdx);
    x.classList.toggle('activo-anim',i===turIdx);
    x.setAttribute('aria-pressed',String(i===turIdx));
  });
  const acumulado=p.slice(0,turIdx+1).reduce((s,x)=>s+x[1],0);
  const total=p.reduce((s,x)=>s+x[1],0);
  document.getElementById('tur-bar').style.width=(acumulado/total*100)+'%';
  document.querySelector('#tur-anim .anim-barra').setAttribute('aria-valuenow',String(Math.round(acumulado/total*100)));
  document.getElementById('tur-msg').textContent=`Paso ${turIdx+1} de ${n}: ${p[turIdx][0]} · minuto acumulado ${acumulado} de ${total}${p[turIdx][2]?' · '+p[turIdx][2]:''}`;
  const fp=document.getElementById('fto-panel');
  if(fp && turCirc==='renacer'){const map=[3,4,4,4,4,5,5];ftoTurPaint(map[turIdx]);}
}
function turStartTramo(){
  const n=CIRCUITOS[turCirc].paradas.length;
  if(turIdx>=n-1){turStop();return;}
  turSegment=turIdx;turPhase=0;turMoving=true;
  const p=document.getElementById('tur-walkers');if(p) p.classList.add('tur-caminando');
}
function turFrame(t){
  if(!turPlaying) return;
  if(!turFrameTime)turFrameTime=t;
  const delta=Math.min(80,Math.max(0,t-turFrameTime));turFrameTime=t;
  if(turMoving){
    const path=document.getElementById('tur-tramo-'+turSegment);
    if(!path){turStop();return;}
    const dur=window.matchMedia('(prefers-reduced-motion: reduce)').matches?280:1950;
    turPhase=Math.min(1,turPhase+delta/dur);
    const u=turPhase<.5?2*turPhase*turPhase:1-Math.pow(-2*turPhase+2,2)/2;
    const point=path.getPointAtLength(path.getTotalLength()*u);
    turPlace(point.x,point.y);
    if(turPhase>=1){
      turIdx=turSegment+1;turMoving=false;turRest=720;
      document.getElementById('tur-walkers').classList.remove('tur-caminando');
      turPaint();
    }
  }else{
    turRest-=delta;
    if(turRest<=0){
      if(turIdx>=CIRCUITOS[turCirc].paradas.length-1){turStop();return;}
      turStartTramo();
    }
  }
  turTimer=requestAnimationFrame(turFrame);
}
function turToggle(){
  const btn=document.getElementById('tur-play');
  if(turPlaying){
    turPlaying=false;
    if(turTimer!==null) cancelAnimationFrame(turTimer);
    turTimer=null;turFrameTime=0;
    document.getElementById('tur-walkers').classList.remove('tur-caminando');
    btn.textContent='Reanudar';return;
  }
  if(turIdx>=CIRCUITOS[turCirc].paradas.length-1){turIdx=0;turPaint();turMoving=false;}
  turPlaying=true;turFrameTime=0;btn.textContent='Pausar';
  if(!turMoving)turStartTramo();
  else document.getElementById('tur-walkers').classList.add('tur-caminando');
  turTimer=requestAnimationFrame(turFrame);
}

function costosCalc(){

    `<div class="leyenda"><span class="l1"></span> Temporada 1 (piloto) <span class="l2"></span> Temporada 2 (con acciones)</div>${barras}

/* Gráfico de líneas simple en SVG (series: [[nombre, valores, color]]) */
function lineasSVG(xs, series, yLabel, limites){
  const W=640, H=240, l=48, r=96, t=14, b=30;
  const all = series.flatMap(s=>s[1]).concat((limites||[]).map(x=>x[0]));
  let lo=Math.min(...all), hi=Math.max(...all);
  const raw=(hi-lo)/4||1, mag=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,2.5,5,10].map(m=>m*mag).find(x=>x>=raw);
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step; if(lo<0 && Math.min(...all)>=0) lo=0;
  const nT=Math.round((hi-lo)/step);
  const X=i=>l+i*(W-l-r)/(xs.length-1), Y=v=>t+(hi-v)*(H-t-b)/(hi-lo);
  let g="";
  for(let k=0;k<=nT;k++){ const v=lo+step*k; g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ddd"/><text x="${l-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#555">${(+v.toFixed(2)).toLocaleString("es-AR")}</text>`; }
  xs.forEach((x,i)=>{ g+=`<text x="${X(i)}" y="${H-10}" font-size="10" text-anchor="middle" fill="#555">${x}</text>`; });
  (limites||[]).forEach(([v,n,c])=>{ g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="5 4"/><text x="${W-r+4}" y="${Y(v)+4}" font-size="10" fill="${c}">${n}</text>`; });
  series.forEach(([n,v,c])=>{ g+=`<polyline fill="none" stroke="${c}" stroke-width="2.2" points="${v.map((y,i)=>X(i)+","+Y(y)).join(" ")}"/>`+v.map((y,i)=>`<circle cx="${X(i)}" cy="${Y(y)}" r="3.4" fill="${c}"><title>${n}: ${y}</title></circle>`).join(""); });
  const ley = series.length>1 ? `<div class="leyenda">${series.map(s=>`<span style="background:${s[2]}"></span>${s[0]}`).join(" ")}</div>` : "";
  return `<div class="tscroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;background:#fff;border:1px solid var(--borde);border-radius:8px" role="img" aria-label="${yLabel}"><text x="12" y="${H/2}" font-size="10" fill="#555" transform="rotate(-90 12 ${H/2})" text-anchor="middle">${yLabel}</text>${g}</svg></div>${ley}`;
}
function cartaSVG(v, lbl, lim){ return lineasSVG(v.map((_,i)=>i+1), [[lbl, v, "#2E5D8A"]], lbl, lim); }

    ${tblT(["Código","Versión","Proceso","Estado"],[["ET-ST-01","01","Servicio turístico · Circuito Renacer","Elaboró, revisó y aprobó: responsables designados por la institución"]])}
    <h2>1. Especificaciones operativas</h2>
    <ul><li><b>Capacidad de carga por turno:</b> grupos de máximo 15 participantes por guía. Previene la degradación del sendero, asegura que se entienda el relato y no satura el taller.</li>

    <h2>2. Infraestructura, accesibilidad y seguridad</h2>
    <ul><li>Ancho útil de sendero mínimo 1,20 m con pendiente longitudinal ≤ 6 % (circulación bidireccional, silla de ruedas y cochecitos).</li><li>Suelo natural consolidado, sin gravilla suelta excesiva, zanjas ni raíces expuestas mayores a 2 cm.</li></ul>

    <h2>5. Seguridad y emergencias</h2>
    <ul><li>Botiquín tipo A portado por el guía, con protocolo antiofídico y de picaduras del secano, y sales de rehidratación.</li><li>Agua potable fresca: mínimo 250 ml por persona.</li></ul>

    <p>El procedimiento P-ST-01 se ejecuta en tres fases: <b>previa</b> (auditoría de baños y recepción, clima, R-ST-03 y PCC-1), <b>ejecutiva</b> (conteo, charla, caminata cronometrada, QR, PCC-2, encuesta y R-ST-05) y <b>documental</b> (entrega de registros, carga en la nube por Año / Mes / Circuito, archivo de originales por 5 años y PCC-3). Los proveedores de agua deben tener habilitación bromatológica y los insumos del botiquín, vencimiento mayor a 60 días al recibirlos.</p>
    <h3>Capacidad del proceso de guiado</h3>
    <div class="kpis"><div class="kpi"><b>μ = 81 min</b><span>Media de 120 visitas (S = 4 min)</span></div><div class="kpi kpi-ok"><b>Cp = 1,25</b><span>(95 − 65) / (6 × 4)</span></div><div class="kpi kpi-ok"><b>Cpk = 1,17</b><span>mín(1,17 ; 1,33)</span></div><div class="kpi"><b>69 a 93 min</b><span>μ ± 3σ, dentro de 65 a 95</span></div></div>
    <p>El proceso es capaz; Cpk &lt; Cp indica un leve descentramiento hacia el límite superior (81 frente a 80 min), que se corrige con mayor control del ritmo en las paradas. Las causas de variabilidad se analizan con las <b>6 M</b> y la mejora sigue los <b>8 pasos del ciclo PHVA</b>.</p>`;

  case "objetivos": return hT("Objetivos de calidad e indicadores (6.2)")+`

  case "costos": return hT("Costos de calidad")+`
    <h2>Actividades de calidad y de no calidad</h2>
    <div class="cards">
      <div class="card"><h3>Procesos estratégicos</h3><p><b>Calidad:</b> diseñar e implementar el SGC (ISO 9001); investigar flora, historia del ferrocarril y saberes Huarpe; convenios con universidad, gobierno y salud; diseño de infraestructura accesible.</p><p><b>No calidad:</b> no aplica (la estrategia está orientada al futuro).</p></div>
      <div class="card"><h3>Procesos operativos</h3><p><b>Calidad:</b> capacitar guías (RCP, primeros auxilios, patrimonio); procedimientos estandarizados; cartelería con QR; verificar clima y grupo ≤ 15; monitorear 80 ± 15 min y encuestas.</p><p><b>No calidad:</b> botiquín incompleto o sin agua; cancelación por Zonda o calor; caídas por irregularidades del sendero.</p></div>
      <div class="card"><h3>Procesos de soporte</h3><p><b>Calidad:</b> mantenimiento de senderos; compra planificada de insumos; turnos ordenados; registro por ID único; auditar planillas y estado de baños y recepción.</p><p><b>No calidad:</b> errores o extravío de reservas; reclamos por pagos digitales sin señal; olvidar comprobantes.</p></div>
    </div>
    <h2>Tabla 1 · Costos por tipo de proceso</h2>`+tblT(["Proceso","Prevención","Evaluación","Fallas internas","Fallas externas"],[
      ["Estratégico","Diseño del SGC; investigación de flora, ferrocarril y saberes; convenios; infraestructura accesible","No aplica","No aplica","No aplica"],
      ["Operativo","Capacitación y certificación de guías; procedimientos y fichas; señalética y QR","Verificación meteorológica; control de carga (≤ 15); monitoreo del ciclo (80 ± 15); encuestas","Retrabajos y demoras por botiquín incompleto o falta de agua detectados antes de partir","Asistencia por caídas; cancelación por Zonda (&gt; 50 km/h) o calor (&gt; 38 °C)"],
      ["Soporte","Mantenimiento preventivo; abastecimiento de insumos; diagramación de turnos","Archivo por ID; auditoría de cobros; inspección de baños y recepción","Corrección de reservas extraviadas o mal cargadas","Reclamos por conectividad en pagos; penalidades por no emitir comprobantes"]])+`
    <h2>Tabla 2 · Costos por operación del proceso operativo</h2>`+tblT(["Operación","Prevención","Evaluación","Fallas internas","Fallas externas"],[
      ["1. Consulta y registro","Herramientas estandarizadas e ID único (VT-2026-001)","Verificación de agenda, cupos y guías","Corrección de datos mal cargados; regularización de registros sin ID","Reubicación o quejas por superposición de turnos"],
      ["2. Pago","Tarifario oficial publicado y canales formales","Control cruzado comprobante–ID–ingreso","Espera por caída de red; conciliación de pagos incompletos","Reclamos por cobros fuera del tarifario"],
      ["3. Preparar el servicio","Mantenimiento de senderos, perímetro de estación y taller","Monitoreo meteorológico 30 min antes; checklist de botiquín e hidratación","Demoras por omisión del chequeo","Compensación por suspensión tardía; emergencias por insolación"],
      ["4. Recepción y charla","Guión estandarizado de seguridad y convivencia","Conteo del tamaño del grupo","Reprogramación por omisión de la inducción","Demoras por contingentes fuera de horario"],
      ["5. Caminata","Formación de guías; mantenimiento de cartelería y QR","Cronometraje en paradas; verificación de QR","Limpieza urgente de QR; reajuste por paradas omitidas","Primeros auxilios y evacuación; devoluciones por interrupción climática"],
      ["6. Regreso y cierre","Espacio de cierre y reflexión","Encuesta de satisfacción (9.1.2)","Encuestas no enviadas por Wi-Fi; recuperación de encuestas omitidas","Quejas por cierres abruptos"],
      ["7. Documentación","Repositorio seguro en la nube e instructivos","Auditoría del archivo bajo ID","Reconstrucción de planillas extraviadas; carga tardía","No conformidades, multas o pérdida de habilitación"]])+`
    <h2>Análisis del reporte interanual de costos</h2>
    <p>Se analiza el último reporte interanual de costos de calidad de la organización (2019 a 2026; 2026 es una estimación) frente al objetivo de calidad: <b>reducir 15 % los costos totales en 3 años</b> y <b>3 % por año</b>.</p>`+
    lineasSVG(COSTOS_ANIOS,[["Costos totales",COSTOS_ANIOS.map((_,i)=>+(COSTOS_SERIES.FI[i]+COSTOS_SERIES.FE[i]+COSTOS_SERIES.PR[i]+COSTOS_SERIES.EV[i]).toFixed(2)),"#A33224"],
      ["No calidad (fallos)",COSTOS_ANIOS.map((_,i)=>+(COSTOS_SERIES.FI[i]+COSTOS_SERIES.FE[i]).toFixed(2)),"#C06500"],
      ["Calidad (prevención + evaluación)",COSTOS_ANIOS.map((_,i)=>+(COSTOS_SERIES.PR[i]+COSTOS_SERIES.EV[i]).toFixed(2)),"#4B6B4A"]],"Millones de $")+
    lineasSVG(COSTOS_ANIOS,[["Fallos internos",COSTOS_SERIES.FI,"#A33224"],["Fallos externos",COSTOS_SERIES.FE,"#C06500"],["Evaluación",COSTOS_SERIES.EV,"#2E5D8A"],["Prevención",COSTOS_SERIES.PR,"#4B6B4A"]],"Millones de $")+
    tblT(["Período","Variación de los costos totales","Objetivo anual (−3 %)"],[["2022 → 2023","−1,4 %","<span class='no'>No cumple</span>"],["2023 → 2024","−7,0 %","<span class='ok'>Cumple</span>"],["2024 → 2025","−9,8 %","<span class='ok'>Cumple</span>"],["2025 → 2026 (estimado)","−1,2 %","<span class='no'>No cumple</span>"]])+`
    <div class="kpis"><div class="kpi kpi-ok"><b>−16,2 %</b><span>Costos totales 2023 → 2025: se cumple el objetivo de mediano plazo (≥ 15 %)</span></div></div>
    <p><b>Modelo tradicional.</b> Las acciones redujeron los fallos internos y las curvas de costos de calidad y de no calidad se fueron aproximando: la organización opera en la zona previa al costo total mínimo, cerca del <b>punto B</b>, con margen para seguir invirtiendo de forma inteligente en calidad.</p>
    <p><b>Cambio de estrategia.</b> Los costos de evaluación son mucho mayores que los de prevención y los fallos externos ya son bajos. Se propone <b>bajar la evaluación y aumentar la prevención</b>; en el circuito, eso significa <b>capacitar a los estudiantes guías</b> y <b>mantener los senderos</b>.</p>`;


  case "amfe": return hT("Gestión de riesgos: AMFE")+`
    <h2>Fundamento normativo</h2>
    <p>La ISO 9001:2015 no exige una metodología específica, pero promueve el pensamiento basado en riesgos. El AMFE se implementa para cumplir con <b>6.1.1 y 6.1.2</b> (riesgos y oportunidades), <b>4.4.1 f</b> (riesgos en cada proceso), <b>8.5.1 g</b> (prevención de errores humanos) y <b>9.1.3 e</b> (eficacia de las acciones).</p>
    <h2>Procedimiento PR-SGC-001</h2>
    ${tblT(["Código","Versión","Vigencia","Proceso asociado"],[["PR-SGC-001","01","29/09/2026","Prestación del servicio de senderismo y guiado turístico"]])}
    <ul><li><b>Objetivo:</b> metodología para identificar, evaluar, mitigar y controlar los riesgos del servicio turístico.</li>
    <li><b>Alcance:</b> desde la concentración inicial hasta la encuesta y el archivo de la documentación.</li>
    <li><b>Responsabilidades:</b> el docente a cargo aprueba el AMFE y audita las acciones; los estudiantes guías identifican fallos, los reportan y aplican los controles.</li>
    <li><b>Frecuencia:</b> revisión anual o ante cambios significativos en el circuito.</li>
    <li><b>Registro:</b> planilla “06-Planilla para AMFE.xlsx”, firmada por el Coordinador del SGC y conservada 3 años en la nube.</li></ul>
    <h3>Umbrales de acción (NPR = G × O × D)</h3>
    <div class="kpis"><div class="kpi kpi-no"><b>NPR ≥ 200</b><span>Inaceptable: acción correctiva antes de la próxima prestación</span></div><div class="kpi kpi-m"><b>NPR 100–199</b><span>Moderado: mejoras preventivas a corto plazo</span></div><div class="kpi kpi-ok"><b>NPR &lt; 100</b><span>Aceptable: controles de rutina</span></div></div>
    <details><summary>Ver escalas de Gravedad, Ocurrencia y Detección (1 a 10)</summary>`+tblT(["Valor","Gravedad (G)","Ocurrencia (O)","Detección (D)"],[
      ["1","Sin efecto perceptible","&lt; 1 en 5.000 turnos","Control preventivo obligatorio lo detecta con certeza"],
      ["2","Inconveniente mínimo resuelto en el acto","1 en 1.000","Verificación estandarizada antes de salir"],
      ["3","Desvío leve estético o de infraestructura","1 en 500","Controles de rutina antes del despacho"],
      ["4","Incumplimiento menor, pequeña molestia","1 en 100","Inspección visual manual habitual"],
      ["5","Falla en soportes de información o pérdida de confort","1 en 50","Detección media durante la preparación"],
      ["6","Insatisfacción evidente o impacto ambiental leve","1 en 20","Se detecta al iniciar la caminata"],
      ["7","Interrupción parcial o reclamo formal","1 en 10","Difícil de advertir antes de afectar al cliente"],
      ["8","Pérdida total de conformidad o incumplimiento normativo crítico","1 en 5","El control casi nunca la advierte antes de la queja"],
      ["9","Riesgo grave para la salud sin lesiones permanentes","1 en 2","Detección casi nula antes del impacto"],
      ["10","Accidente grave o emergencia climática sin evacuación","&gt; 50 % de los turnos","Sin control: llega al cliente"]])+`</details>
    <div class="anim-ctrl noprint"><button class="btn-imp" id="amfe-ren">AMFE Circuito Renacer (adaptado)</button><button class="btn-imp" id="amfe-sj">AMFE Circuito San José (original)</button></div>
    <div id="amfe-out"></div>`;

  case "sig": return hT("Sistema Integrado de Gestión: contingencia climática")+`

    <h2>Árbol de decisión del protocolo</h2>

  case "impactos": {
    const cols=["Agua subterránea","Calidad del aire","Olores","Nivel sonoro","Superficie intervenida","Calidad del suelo","Flora y fauna","Paisaje","Tránsito y transporte","Economía local","Empleo","Identidad y cultura Huarpe","Escuela Raíces Huarpes","Residuos","Redes de servicio"];

    <ul><li><b>Positivos:</b> economía local, empleo, identidad y cultura Huarpe y la propia escuela, en todos los procesos; los estratégicos además favorecen flora, fauna y paisaje.</li>

    <li><b>Gestión:</b> grupos de 5 a 15 por guía, sendero delimitado, inspecciones previas, gestión de residuos y recorridos alternativos tras una contingencia.</li></ul>`;}

  case "inspeccion": return hT("Plan de inspección y control del comitente (PICC)")+`
    <p class="lead">La Inspección del Comitente supervisa el servicio <b>mientras se presta</b> (aseguramiento de la calidad) y complementa el control de calidad del Contratista. Abarca recepción y sanitarios, la red de senderos, el taller de la artesana y el perímetro de la estación abandonada, en las siete etapas del servicio.</p>
    <h2>Tipos de punto de inspección</h2>
    <div class="kpis"><div class="kpi"><b>R</b><span>Revisión documental, sin detener la operación</span></div><div class="kpi kpi-m"><b>W</b><span>Testigo: el Inspector presencia la actividad</span></div><div class="kpi kpi-no"><b>H</b><span>Hold Point: no se avanza sin firma del Inspector</span></div></div>`+
    tblT(["Etapa","Control del Contratista (CC)","Verificación del Comitente (AC)","Punto"],[
      ["1. Consulta y registro","Registro con ID; fecha, circuito y guías habilitados","Auditoría semanal de ID y cupos","R"],
      ["2. Pago","Precios visibles; comprobante vinculado al ID","Auditoría de comprobantes y precios","R"],
      ["3. Preparar el servicio (PCC-1)","Sendero ≤ 2 cm; cierre ≥ 1,50 m; agua y botiquín; clima; R-ST-03","Inspección en campo y contraste con el SMN; sin su firma en “Go” no se sale","<b>H</b>"],
      ["4. Recepción y charla","Conteo por guía; charla completa según guión","Inspección sorpresa; verificación del conteo","W"],
      ["5. Caminata (PCC-2)","Guiado, cronometraje, hidratación, QR, R-ST-05","Fiscalización en la parada intermedia","W"],
      ["6. Regreso y cierre","Plenario y 100 % de encuestas","Tasa de encuestas y quejas","W"],
      ["7. Documentación (PCC-3)","Carga en la nube en ≤ 24 h bajo el ID","Auditoría semanal con R-DOC-01","R"]])+`
    <h2>Criterios de aceptación</h2>`+tblT(["Parámetro","Criterio","Instrumento","Frecuencia","Evidencia"],[
      ["Viento Zonda","&lt; 50 km/h","SMN / Defensa Civil","T − 30 min","Reporte firmado"],["Temperatura","&lt; 38 °C a la sombra","Termómetro calibrado","T − 30 min","R-ST-03"],
      ["Índice UV","≤ 8 (si &gt; 8, hidratación cada 20 min)","App oficial","T − 30 min","R-ST-03"],["Agua","≥ 2 L por persona y turno","Control volumétrico","Cada turno","R-ST-03"],
      ["Botiquín tipo A","100 % precintado y vigente","Lista de chequeo","Cada turno","R-ST-03"],["Cierre de la estación","≥ 1,50 m, continuo","Cinta métrica","Semanal","R-INF-01"],
      ["Sendero","≤ 2 cm","Regla o cinta","Diaria","R-INF-01"],["Grupo","5 a 15 por guía","Conteo","Inicio del turno","R-ST-05"],
      ["Tiempo de ciclo","80 ± 15 min","Cronómetro","Cada turno","R-ST-05"],["QR","100 % de lectura","Smartphone","Diaria","R-ST-03"],["Carga documental","100 % en ≤ 24 h","Auditoría de la nube","Semanal","R-DOC-01"]])+`
    <h2>Hallazgos y recepción del servicio</h2>`+tblT(["Hallazgo","Ejemplo","Efecto","Plazo"],[
      ["Observación","Desvío menor sin impacto","Registro","5 días hábiles"],["NC Menor","Carga documental &gt; 24 h; un QR ilegible con respaldo","Contención y plan","48 h"],
      ["NC Mayor","Partir con Zonda ≥ 50 km/h, botiquín incompleto o sin firma del PCC-1","Orden de paralización","12 h"]])+`
    <ol><li><b>Recepción provisoria:</b> documentación completa (Plan de Calidad, Plan SST, certificaciones, habilitaciones) y comprobación de senderos y cierre.</li>
    <li><b>Período de prueba:</b> 30 días o 120 visitas fiscalizadas, Cp ≥ 1,25, cero NC Mayores abiertas y 100 % de carga documental.</li>
    <li><b>Recepción definitiva:</b> acta de liberación del servicio, sujeta a auditorías periódicas.</li></ol>`;

  case "cartas": return hT("Control estadístico: capacidad y cartas de control")+`
    <p class="lead">Aplicación de las herramientas de control estadístico a un caso de servicio: una distribuidora eléctrica con dos parámetros contractuales, <b>5 cortes por cliente al mes</b> como máximo y <b>120 min</b> de duración promedio máxima.</p>
    <h2>Capacidad y desempeño (solo LSE = 120 min)</h2>
    <div class="kpis"><div class="kpi"><b>X̿ = 114,98</b><span>Media del período (min)</span></div><div class="kpi"><b>σ = 1,505</b><span>Corto plazo: R̄ / d₂ = 3,5 / 2,326</span></div><div class="kpi"><b>σ = 10,444</b><span>Largo plazo: 50 datos</span></div><div class="kpi kpi-ok"><b>Cps = 1,112</b><span>Capacidad a corto plazo</span></div><div class="kpi kpi-no"><b>Pps = 0,160</b><span>Desempeño real a largo plazo</span></div></div>
    <p>La enorme diferencia entre capacidad y desempeño indica que la media del proceso no es estable. Para que los índices predigan el futuro, el proceso debe estar bajo control estadístico.</p>
    <h2>Carta X̄–R (n = 5)</h2>`+cartaSVG(CARTA_X,"Media mensual (min)",[[117.00,"LSC 117,00","#A33224"],[114.98,"LC 114,98","#4B6B4A"],[112.96,"LIC 112,96","#A33224"],[120,"LSE 120","#D4A017"]])+
    cartaSVG(CARTA_R,"Rango mensual (min)",[[7.40,"LSC 7,40","#A33224"],[3.5,"LC 3,5","#4B6B4A"],[0,"LIC 0","#A33224"]])+`
    <ul><li><b>Carta R:</b> rangos entre 3 y 5, dentro de 0 a 7,40: la variabilidad dentro de cada mes es estable.</li>
    <li><b>Carta X̄:</b> proceso <b>extremadamente inestable</b>; solo el mes 6 queda dentro de los límites y hay una deriva ascendente durante los diez meses. Esa causa especial explica la diferencia entre Cps y Pps.</li></ul>
    <h2>Carta p: sectores con cortes excesivos (n = 50)</h2>`+cartaSVG(CARTA_P,"Proporción no conforme",[[0.195,"LSC 0,195","#A33224"],[0.08,"p̄ 0,08","#4B6B4A"],[0,"LIC 0","#A33224"]])+`
    <p>Ningún punto supera el LSC y no hay patrones: el proceso es <b>estable</b>, pero incumple el contrato de forma estructural (8 % de sectores no conformes). Un proceso puede ser estable y, a la vez, incapaz.</p>
    <h2>Aplicación al circuito turístico</h2>
    <p>El mismo razonamiento se aplica al <b>tiempo de ciclo del recorrido</b> (80 ± 15 min): con las planillas R-ST-05 se puede construir una carta X̄–R para verificar la estabilidad antes de interpretar la capacidad (Cp = 1,25; Cpk = 1,17), y una carta p con la proporción de salidas fuera de tiempo o suspendidas, para separar problemas estructurales de causas especiales como una jornada de viento Zonda.</p>`;

  default: return hT(p.nombre)+`<p class="lead">${p.subtitulo}</p><h2>Diagnóstico y requisito</h2><p>${p.diagnostico}</p><h2>Documentación del proyecto</h2><ul class="docs">${p.docs.map(d=>`<li>${d}</li>`).join("")}</ul>`;
  }
}

/* Tabla AMFE con colores de NPR */
function amfeRender(cual){
  const D = cual==="sj" ? AMFE_SJ : AMFE_REN;
  const el=document.getElementById("amfe-out"); if(!el) return;
  document.getElementById("amfe-ren").classList.toggle("sel",cual!=="sj");
  document.getElementById("amfe-sj").classList.toggle("sel",cual==="sj");
  const filas = D.map(r=>{ const n1=r[3]*r[5]*r[7], n2=r[10]*r[11]*r[12];
    return [r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],`<span class="npr ${nprCls(n1)}">${n1}</span>`,r[8],r[9],r[10],r[11],r[12],`<span class="npr ${nprCls(n2)}">${n2}</span>`]; });
  const i0=D.filter(r=>r[3]*r[5]*r[7]>=200).length, m0=D.filter(r=>{const v=r[3]*r[5]*r[7];return v>=100&&v<200;}).length;
  const i1=D.filter(r=>r[10]*r[11]*r[12]>=200).length, m1=D.filter(r=>{const v=r[10]*r[11]*r[12];return v>=100&&v<200;}).length;
  const s0=D.reduce((s,r)=>s+r[3]*r[5]*r[7],0), s1=D.reduce((s,r)=>s+r[10]*r[11]*r[12],0);
  el.innerHTML = `<h3>${cual==="sj"?"Recorrido turístico San José · AMFE del 30/09/2026":"Circuito Renacer · adaptación del AMFE (propuesta)"}</h3>
   ${cual==="sj"?"":prop("Se reutilizan los modos de fallo comunes del AMFE de San José (clima, botiquín, sendero, QR, tiempos) y se agregan los propios de la plaza, la estación y el taller artesanal.")}
   <div class="kpis"><div class="kpi"><b>${D.length}</b><span>Modos de fallo analizados</span></div>
   <div class="kpi"><b>${i0} → ${i1}</b><span>Riesgos inaceptables (NPR ≥ 200) antes → después</span></div>
   <div class="kpi"><b>${m0} → ${m1}</b><span>Riesgos moderados antes → después</span></div>
   <div class="kpi kpi-ok"><b>${((1-s1/s0)*100).toFixed(0)} %</b><span>Reducción del NPR total</span></div></div>
   `+tblT(["Paso","Modo de fallo","Efecto","G","Causa","O","Control actual","D","NPR inicial","Acción","Responsable","G'","O'","D'","NPR final"],filas,"amfe");
}

}

/* ---------- Menú del sitio: panel desplegable con todo el contenido ---------- */
(function(){
  const btn=document.getElementById("btn-menu"), panel=document.getElementById("panel-menu");
  if(!btn||!panel) return;
  const li=(go,t,cls)=>`<li><a href="#" data-go="${go}"${cls?` class="${cls}"`:""}>${t}</a></li>`;
  const dg=(pr,k)=>(k==="politica"||k==="clausulas")?"sig||":`detalle|${pr}|${k}`;
  const docs=(pr,items)=>items.map(([k,t,h])=>`<li><a href="#" data-go="${dg(pr,k)}">${t}</a>${h?`<ul>${h.map(([k2,t2])=>li(dg(pr,k2),t2)).join("")}</ul>`:""}</li>`).join("");
  panel.innerHTML=`<div class="pm-cab"><span>Menú</span><button type="button" class="pm-cerrar" aria-label="Cerrar menú">Cerrar ✕</button></div><div class="cols">
    <div class="c-sitio"><h3>El sitio</h3><ul>
      ${li("inicio||","Inicio")}${li("escuela||","La Escuela")}${li("sig||","Sistema Integrado de Gestión")}${li("galeria||","Galería")}${li("conclusiones||","Conclusiones y directrices")}${li("contacto||","Equipo y contacto")}
    </ul></div>
    <div class="c-cos"><h3>Cosmética Natural de Jarilla</h3><ul>
      ${li("detalle|cosmetica|","Descripción del proyecto","principal")}${docs("cosmetica",INDICE)}
    </ul></div>
    <div class="c-tur"><h3>Circuito Turístico</h3><ul>
      ${li("detalle|turismo|","Descripción del proyecto","principal")}${docs("turismo",INDICE.filter(x=>x[0]!=="qfd").concat(INDICE_TUR_EXTRA))}
    </ul></div>
  </div>`;
  const cerrar=(volver)=>{panel.hidden=true;document.body.classList.remove("menu-abierto");btn.setAttribute("aria-expanded","false"); if(volver) btn.focus();};
  panel.addEventListener("click",e=>{ if(e.target.closest(".pm-cerrar")) cerrar(true); });
  btn.addEventListener("click",()=>{const abrir=panel.hidden;panel.hidden=!abrir;document.body.classList.toggle("menu-abierto",abrir);btn.setAttribute("aria-expanded",String(abrir)); if(abrir){const a=panel.querySelector("a"); if(a) a.focus({preventScroll:true});}});
  panel.addEventListener("click",e=>{ if(e.target.closest("a[data-go]")) cerrar(false); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !panel.hidden) cerrar(true); });
  document.addEventListener("click",e=>{ if(!panel.hidden && !e.target.closest("#panel-menu") && !e.target.closest("#btn-menu")) cerrar(false); });
})();

const VOCES = [
  ["Sabrina Mataloni","turismo",""],
  ["Bernardo Costarelli","cosmetica",""],
  ["Isabella Morandini","turismo","test test"],
  ["Franco La Motta","cosmetica",""],
  ["Tomás Raby","turismo","En lo personal, considero que fue una experiencia muy enriquecedora, que me permitió conocer realidades diferentes a la mía y aportar, desde nuestro lugar, una posible herramienta para que los chicos puedan desarrollar una actividad económica en el futuro. Sin embargo, también tuvo sus dificultades, principalmente porque desde un principio la propuesta no despertaba demasiado interés en los alumnos. Esto hizo que por momentos el trabajo resultara frustrante, ya que no siempre encontrábamos la respuesta que esperábamos. De todas formas, creo que estas situaciones también forman parte de la realidad y que fue importante aprender a trabajar con ellas.\n\nEn cuanto a la gestión de la calidad, fue un desafío importante porque prácticamente no contábamos con información, documentación ni un sistema previo sobre el cual trabajar, por lo que tuvimos que desarrollar todo desde cero. Si bien esto complicó bastante el trabajo, también fue una de las partes más interesantes, porque nos obligó a pensar en todos los aspectos de los procesos y a buscar por nuestra cuenta cómo organizarlos y controlarlos. Creo que eso nos ayudó a comprender mucho mejor la magnitud y la importancia de implementar un sistema de gestión de la calidad, más allá de lo que habíamos visto en clase.\n\nEn general, me llevo una experiencia muy positiva, con muchos aprendizajes tanto desde lo académico como desde lo personal. A pesar de las dificultades, estoy contento de haber participado y de haber tenido la oportunidad de aplicar nuestros conocimientos en una situación real."],
  ["Tomás Aliaga","cosmetica",""],
  ["Juan Pablo Siracusa","turismo",""],
  ["Andrés Landgrebe","cosmetica",""]
];
function voces(){
  const v = VOCES.filter(x=>x[2] && x[2].trim());
  if(!v.length) return "";
  const ini = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const pr = {turismo:"Circuito Turístico",cosmetica:"Cosmética Natural"};
  return `<h2>Lo que nos dejó la PSE</h2>
    <p class="voces-intro">Los estudiantes de Ingeniería cuentan cómo vivieron el proyecto.</p>
    <div class="voces">${v.map(([n,p,t])=>`<figure class="voz ${p}"><blockquote>${t.trim().split(/\n\s*\n/).map(x=>`<p>${x.trim()}</p>`).join("")}</blockquote><figcaption>${AVATARES[n]?`<span class="ava" aria-hidden="true">${AVATARES[n]}</span>`:`<span class="ini" aria-hidden="true">${ini(n)}</span>`}<span><b>${n}</b><small>${pr[p]||""}</small></span></figcaption></figure>`).join("")}</div>`;
}
