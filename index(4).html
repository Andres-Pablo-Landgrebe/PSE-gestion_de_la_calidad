<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSE Escuela Raíces Huarpes · Emprender e Innovar</title>
<style>
  :root{
    --bg:#fbfaf6; --texto:#2e2a24; --borde:#e4dccd;
    --acc:#6A9624; --acc-suave:#BFE878; --acc-osc:#4A6B1F; --acc-txt:#4A6B1F; --hov:#eaf5d2;
  }
  /* Turismo: paleta anaranjada (#af5700 · #c06500 · #d27300 · #e48200 · #f69100 · #ffa333 · #ffba6a · #ffd19b · #ffe8cd) */
  body.turismo{ --acc:#c06500; --acc-suave:#ffe8cd; --acc-osc:#af5700; --acc-txt:#8a4500; --hov:#ffe8cd; --borde:#f1d9bb; --bg:#fffaf3; }
  body.comun{ --acc:#2e5d8a; --acc-suave:#dde9f4; --acc-osc:#1d3f61; --acc-txt:#1d3f61; --hov:#e8f0f8; background:linear-gradient(rgba(251,250,246,.92),rgba(251,250,246,.92)),url("img/mural.jpg") center/cover fixed; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Open Sans",Lato,Roboto,Arial,sans-serif;font-size:16px;background:var(--bg);color:var(--texto);line-height:1.65}
  h1,h2,h3,nav,.btn,.logo-txt{font-family:Montserrat,Inter,Poppins,Arial,sans-serif}

  header{background:var(--acc-osc);color:#fff;padding:16px 24px;transition:background-color .25s ease}
  .head-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{width:64px;height:64px;flex:0 0 64px;border-radius:8px;object-fit:cover;background:#fff}
  .logo-txt{flex:1;min-width:220px}
  .logo-txt .nom{font-size:20px;font-weight:700;margin:0;line-height:1.2}
  .logo-txt .sub{font-size:14px;opacity:.9;margin-top:4px}
  .selector{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  .logos-inst{display:flex;gap:8px;align-items:center}
  .logos-inst img{height:52px;width:auto;background:#fff;border-radius:6px;padding:4px}
  .btn-proy{border:2px solid var(--acc);background:#fff;color:var(--acc-osc);padding:9px 16px;border-radius:6px;cursor:pointer;font-size:15px;font-weight:600}
  .btn-proy.activo{background:var(--acc);color:#fff}
  .btn{border:2px solid #fff;background:transparent;color:#fff;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
  .btn:hover{background:rgba(255,255,255,.15)}
  .btn.activo{background:#fff;color:var(--acc-osc)}

  nav{background:#fff;border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:5}
  nav .in{max-width:1080px;margin:0 auto;display:flex;gap:2px;flex-wrap:wrap;padding:0 12px}
  nav button{border:0;background:none;padding:14px 12px;font-size:14px;cursor:pointer;color:var(--texto);border-bottom:3px solid transparent;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
  nav button:hover{background:var(--hov);color:var(--acc-osc);border-bottom-color:var(--acc-suave)}
  nav button.activa{color:var(--acc-osc);border-bottom-color:var(--acc);font-weight:700}
  nav button.activa:hover{border-bottom-color:var(--acc)}

  main{max-width:1080px;margin:0 auto;padding:28px 24px 64px}
  h1.t{font-size:36px;color:var(--acc-osc);margin:6px 0 8px;line-height:1.2}
  h2{font-size:24px;color:var(--acc-osc);margin:26px 0 8px}
  h3{font-size:20px;color:var(--acc);margin:18px 0 6px}
  .lead{font-size:18px;color:#4a443b}
  .tag{display:inline-block;background:var(--acc-suave);color:var(--acc-txt);padding:3px 10px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:8px}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
  .card{background:#fff;border:1px solid var(--borde);border-top:6px solid var(--acc);border-radius:10px;padding:22px;transition:box-shadow .2s, transform .2s, background-color .2s}
  .card[data-go]{cursor:pointer}
  .card[data-go]:hover{box-shadow:0 8px 20px rgba(0,0,0,.12);transform:translateY(-3px);background:var(--hov)}
  .card h3{margin-top:0}

  .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
  .dato{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:14px}
  .dato b{display:block;color:var(--acc-osc);font-family:Montserrat,Arial,sans-serif;font-size:15px}
  .dato span{font-size:14px;color:#554f45}

  .foto{background:#EBE0D5;border:2px dashed var(--acc);border-radius:8px;min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--acc-osc);font-size:14px;margin:14px 0;padding:12px}
  .galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
  .galeria figure{margin:0;background:#fff;border:1px solid var(--borde);border-radius:8px;overflow:hidden}
  .galeria .marco{height:170px;background:var(--acc-suave);display:flex;align-items:center;justify-content:center;color:var(--acc-osc);font-size:13px;text-align:center;padding:10px}
  .galeria .marco img{width:100%;height:100%;object-fit:cover}
  .galeria figcaption{font-size:14px;padding:10px 12px;color:#4a443b}

  .pendiente{background:#fff8e1;border-left:4px solid #d4a017;padding:10px 14px;border-radius:4px;font-size:14px;margin:12px 0}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;background:#fff}
  th,td{border:1px solid var(--borde);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--acc-suave);color:var(--acc-txt)}
  ul,ol{padding-left:22px}
  li{margin-bottom:4px}
  .docs li{margin-bottom:6px}
  .nota{font-size:13px;color:#6b6358}

  .btn-imp{background:var(--acc);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;margin-bottom:8px;transition:background-color .18s ease,transform .18s ease,box-shadow .18s ease}
  .btn-imp:hover{background:var(--acc-osc);transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.18)}
  body.turismo .btn-imp{background:var(--acc-osc)}
  body.turismo .btn-imp:hover{background:var(--acc-txt)}
  .foto-fig{margin:14px 0}
  .foto-fig img{width:100%;max-height:340px;object-fit:cover;border-radius:8px;border:1px solid var(--borde);display:block}
  .foto-fig figcaption{font-size:13px;color:#4a443b;margin-top:4px}
  .sim-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .sim-in input{width:110px;padding:6px;font-size:15px;border:1px solid var(--borde);border-radius:4px}
  .anim-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .anim-track{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:10px 0}
  .anim-paso{background:#fff;border:1px solid var(--borde);border-radius:6px;padding:8px 10px;font-size:14px;cursor:pointer;opacity:.55;transition:.3s}
  .anim-paso:hover{opacity:1;background:var(--hov);border-color:var(--acc)}
  .anim-paso .num{display:inline-block;background:var(--acc-suave);color:var(--acc-osc);border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px;margin-right:6px;font-weight:700}
  .anim-paso.hecho{opacity:.85;border-color:var(--acc)}
  .anim-paso.activo-anim{opacity:1;background:var(--acc);color:#fff;transform:scale(1.03);border-color:var(--acc)}
  .anim-paso.activo-anim .num{background:#fff;color:var(--acc-osc)}
  .anim-barra{height:10px;background:var(--acc-suave);border-radius:6px;overflow:hidden}
  #anim-bar{height:100%;width:0;background:var(--acc);transition:width .5s}
  .escena svg{width:100%;max-width:420px;display:block;margin:0 auto}
  .sway,.spin,.bob,.wave,.drip,.steam,.tilt,.wobble,.grow,.slide,.blink,.draw{transform-box:fill-box;transform-origin:50% 50%}
  .sway{animation:sway 2.2s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .spin{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bob{animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .wave{animation:wave 2s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
  .drip{animation:drip 1.2s ease-in infinite}
  @keyframes drip{0%{transform:translateY(-12px);opacity:0}30%{opacity:1}100%{transform:translateY(40px);opacity:0}}
  .steam{animation:steam 2s ease-out infinite}
  @keyframes steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  .tilt{animation:tilt 2s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .wobble{animation:wob 1.4s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,.88)}}
  .grow{animation:grow 2s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes grow{0%{transform:scaleY(.2)}60%,100%{transform:scaleY(1)}}
  .slide{animation:slide 2.4s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-40px);opacity:0}40%,100%{transform:none;opacity:1}}
  .blink{animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.15}}
  .draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.8s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  #fto-panel .fto table{font-size:13px}
  /* ---------- Menú desplegable de "Proyectos" ---------- */
  .dd{position:relative;display:flex}
  .dd-menu{position:absolute;top:100%;left:0;min-width:240px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--borde);border-top:3px solid var(--acc);border-radius:0 0 10px 10px;box-shadow:0 10px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;padding:4px 0;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .16s ease,transform .16s ease,visibility .16s;z-index:20}
  .dd:hover .dd-menu,.dd:focus-within .dd-menu{opacity:1;visibility:visible;transform:none}
  .dd.cerrado .dd-menu{opacity:0;visibility:hidden}
  nav .dd-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 18px;border:0;border-left:4px solid transparent;font-size:14px;white-space:nowrap}
  nav .dd-menu button::before{content:"";width:12px;height:12px;border-radius:50%;flex:0 0 12px}
  nav .dd-menu button[data-go*="|turismo|"]::before{background:#d27300}
  nav .dd-menu button[data-go*="|cosmetica|"]::before{background:#6A9624}
  nav .dd-menu button[data-go*="|turismo|"]:hover{background:#ffe8cd;color:#8a4500;border-left-color:#d27300}
  nav .dd-menu button[data-go*="|cosmetica|"]:hover{background:#eaf5d2;color:#4A6B1F;border-left-color:#6A9624}
  .dd-caret{font-size:10px;margin-left:5px;opacity:.7}

  /* ---------- Transición entre ventanas (fade rápido) ---------- */
  #contenido{transition:opacity .2s ease}
  #contenido.saliendo{opacity:0;transition-duration:.12s}

  /* ---------- Vista dividida de Proyectos ---------- */
  body.dividida main{max-width:none;padding:0}
  .split{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 131px)}
  .half{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:14px;padding:clamp(40px,12vh,120px) clamp(24px,6vw,84px) 56px;position:relative;overflow:hidden}
  .half .ico{width:76px;height:76px;margin-bottom:6px}
  .half h2{font-size:clamp(26px,3.2vw,38px);margin:0;line-height:1.15}
  .half p{font-size:17px;max-width:460px;margin:0}
  .half .etq{font-family:Montserrat,Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .half.tur{background:linear-gradient(155deg,#ffe8cd 0%,#ffd19b 100%);color:#4a2500}
  .half.tur h2,.half.tur .etq{color:#8a4500}
  .half.cos{background:linear-gradient(155deg,#f4fbe3 0%,#BFE878 100%);color:#27360f}
  .half.cos h2,.half.cos .etq{color:#4A6B1F}
  .ver{font-family:Montserrat,Arial,sans-serif;font-size:16px;font-weight:700;color:#fff;border:2px solid transparent;border-radius:8px;padding:12px 28px;cursor:pointer;margin-top:10px;transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}
  .half.tur .ver{background:#af5700}
  .half.cos .ver{background:#4A6B1F}
  .half.tur .ver:hover{background:#fff;color:#af5700;border-color:#af5700;transform:translateY(-2px);box-shadow:0 6px 14px rgba(175,87,0,.25)}
  .half.cos .ver:hover{background:#fff;color:#4A6B1F;border-color:#4A6B1F;transform:translateY(-2px);box-shadow:0 6px 14px rgba(74,107,31,.25)}
  .half .ver .flecha{display:inline-block;transition:transform .2s ease;margin-left:6px}
  .half .ver:hover .flecha{transform:translateX(4px)}

  /* ---------- Página de cada proyecto + índice ---------- */
  .mig{font-size:14px;margin:0 0 12px;color:#6b6358}
  .mig a{color:var(--acc-txt);text-decoration:none;padding:2px 6px;border-radius:4px;transition:background-color .15s ease}
  .mig a:hover{background:var(--hov);text-decoration:underline}
  .mig .sep{margin:0 6px 0 2px;opacity:.6}
  .indice,.indice ol{list-style:none;padding-left:0;counter-reset:n}
  .indice ol{padding-left:30px;margin-top:6px}
  .indice li{counter-increment:n;margin-bottom:8px}
  .indice li::before{content:counters(n,".") "  ";font-family:Montserrat,Arial,sans-serif;font-weight:700;color:var(--acc-txt)}
  .indice > li::before{content:counters(n,".") ".  "}
  .indice a{display:inline-block;color:var(--acc-txt);text-decoration:none;font-size:16px;padding:3px 10px;border-radius:6px;border:1px solid transparent;transition:background-color .15s ease,border-color .15s ease,transform .15s ease}
  .indice a:hover{background:var(--hov);border-color:var(--acc);transform:translateX(3px)}
  .indice > li > a{font-weight:700}
  .volver{display:block;width:fit-content;margin:6px 0 12px;font-size:14px;color:var(--acc-txt);text-decoration:none;padding:4px 10px;border-radius:6px;border:1px solid var(--acc);transition:background-color .15s ease,color .15s ease}
  .volver:hover{background:var(--acc-osc);color:#fff}
  body.turismo .volver:hover{background:var(--acc-osc)}

  button:focus-visible,a:focus-visible,[data-go]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){#contenido,#contenido.saliendo,.dd-menu{transition:none}}
  .lfb{background:#fff;color:var(--acc-osc);padding:6px 10px;border-radius:6px;font-weight:700;font-size:13px}

  /* ---------- Agregados Proyecto B · Turismo ---------- */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
  .tscroll table{margin:0;min-width:560px}
  .propuesta{background:#fff3e0;border-left:4px solid #e48200;padding:10px 14px;border-radius:4px;font-size:14px;margin:12px 0}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
  .kpi{background:#fff;border:1px solid var(--borde);border-left:6px solid var(--acc);border-radius:8px;padding:12px 14px}
  .kpi b{display:block;font-family:Montserrat,Arial,sans-serif;font-size:22px;color:var(--acc-osc);line-height:1.2}
  .kpi span{font-size:13px;color:#554f45}
  .kpi-ok{border-left-color:#3f8f3a}.kpi-ok b{color:#2f6f2b}
  .kpi-no{border-left-color:#b5472d}.kpi-no b{color:#9a3420}
  .kpi-m{border-left-color:#d4a017}.kpi-m b{color:#8a6a00}
  .ok{color:#2f6f2b;font-weight:600}.no{color:#9a3420;font-weight:600}.parcial{color:#8a6a00;font-weight:600}
  .checks{list-style:none;padding-left:0}.checks li{background:#fff;border:1px solid var(--borde);border-radius:6px;padding:8px 12px}
  .formula{font-family:Consolas,monospace;font-size:13px;background:var(--acc-suave);padding:8px 10px;border-radius:6px}
  .sim-in select{padding:6px;font-size:15px;border:1px solid var(--borde);border-radius:4px;background:#fff}
  .npr{display:inline-block;min-width:38px;text-align:center;padding:2px 6px;border-radius:10px;font-weight:700}
  .npr-i{background:#f6d3cb;color:#8a2a17}.npr-m{background:#fbeab0;color:#6f5400}.npr-a{background:#d8ecd2;color:#2f5f2b}
  table.amfe{font-size:12.5px;min-width:1100px}
  table.qfd td.c{text-align:center;font-size:16px;color:var(--acc-osc)}
  table.qfd th.vert{height:150px;vertical-align:bottom;padding:6px 4px;width:44px}
  table.qfd th.vert span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;white-space:nowrap}
  .btn-imp.sel{outline:3px solid var(--acc-suave);outline-offset:1px}
  .barra-f{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center;font-size:13px;margin:6px 0}
  .barra-f div{display:flex;flex-direction:column;gap:3px}
  .barra-f i{display:block;height:10px;background:var(--acc);border-radius:4px;transition:width .4s}
  .barra-f i.b2{background:#6A9624}
  .leyenda{font-size:13px;margin:12px 0 4px}.leyenda span{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}
  .leyenda .l1{background:var(--acc)}.leyenda .l2{background:#6A9624}
  #c-tab input{width:110px;padding:4px;border:1px solid var(--borde);border-radius:4px}
  .pmap{display:grid;grid-template-columns:170px 1fr 170px;gap:12px;margin:14px 0;font-size:13px}
  .pm-cli{background:#fff;border:2px solid #555;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
  .pm-cli span{border:1px solid var(--borde);border-radius:6px;padding:4px 6px;background:#fffaf3}
  .pm-centro{display:flex;flex-direction:column;gap:10px}
  .pm-caja{border-radius:10px;padding:10px 12px;border:2px solid}
  .pm-caja b{display:block;text-align:center;font-family:Montserrat,Arial,sans-serif;margin-bottom:6px}
  .pm-est{border-color:#c2415a;background:#fdf0f2}.pm-op{border-color:#e48200;background:#fff6e8}.pm-sop{border-color:#7b5ea7;background:#f5f0fb}
  .pm-flujo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
  .pm-flujo>span{background:#fff;border:1px solid #999;border-radius:6px;padding:6px 8px}
  .pm-flujo>span:nth-child(even){border:0;background:none;font-size:18px;padding:0}
  .pm-dos{display:flex;flex-direction:column;gap:4px}.pm-dos em{font-style:normal;border:1px solid var(--borde);border-radius:4px;padding:3px 6px;background:#fffaf3}
  .pasos-op{counter-reset:p;list-style:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:0}
  .pasos-op li{counter-increment:p;background:#fff8d9;border:1px solid #e0c25a;border-radius:8px;padding:8px 14px;width:min(420px,100%);text-align:center;position:relative;margin-bottom:20px}
  .pasos-op li::before{content:counter(p)". ";font-weight:700}
  .pasos-op li:not(:last-child)::after{content:"↓";position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);color:#999}
  .arbol li{margin-bottom:8px}
  details{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:8px 12px;margin:12px 0}
  details summary{cursor:pointer;font-weight:600;color:var(--acc-osc)}
  .pdf-box{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:30px 0 6px;padding:14px 18px;background:#fff;border:1px solid var(--borde);border-left:6px solid var(--acc);border-radius:8px}
  .pdf-box b{display:block;font-family:Montserrat,Arial,sans-serif;color:var(--acc-osc)}
  .pdf-box span{font-size:14px;color:#554f45}
  .pdf-box .btn-imp{margin:0;text-decoration:none;display:inline-block}
  table.imp{font-size:12px;min-width:980px}
  table.imp th.vert{height:140px;vertical-align:bottom;padding:6px 3px;width:34px}
  table.imp th.vert span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;white-space:nowrap}
  table.imp td.ip{background:#bfe3b4;color:#235b1f;text-align:center;font-weight:700}
  table.imp td.in{background:#f3c2b8;color:#8a2a17;text-align:center;font-weight:700}
  @media(max-width:760px){ .pmap{grid-template-columns:1fr} .barra-f{grid-template-columns:1fr} }
  @media print{header,nav,.noprint,.selector{display:none!important} .tscroll{overflow:visible} details{display:block} body,body.comun{background:#fff!important} main{padding:0} .card{box-shadow:none} h1.t,h2,h3{color:#000} .tag{border:1px solid #000} th{background:#eee}}
  @media(max-width:760px){
    .cards,.datos{grid-template-columns:1fr}
    h1.t{font-size:28px}
    .selector{margin-left:0;width:100%}
    .btn{flex:1}
    .split{grid-template-columns:1fr;min-height:0}
    .half{padding:40px 24px}

/* ---------- Simulación ---------- */
function simRun(){
  const el=document.getElementById("simout"); if(!el) return;
  if(proy==="cosmetica"){
    const n=Math.max(1,Math.round(+document.getElementById("nenv").value||12));
    const m=n*50, v=m*500/600, c=m/6, o=m/6, a=m*0.01;
    el.innerHTML=`<table><tr><th>Componente</th><th>Masa para ${n} envases (${m} g)</th></tr>
      <tr><td>Vaselina (base)</td><td>${v.toFixed(0)} g</td></tr>
      <tr><td>Cera de abeja (espesante)</td><td>${c.toFixed(0)} g</td></tr>
      <tr><td>Oleato de jarilla</td><td>${o.toFixed(0)} g</td></tr>
      <tr><td>Aroma de limón (máx. 1 % m/m)</td><td>hasta ${a.toFixed(1)} g</td></tr></table>
      <p class="nota">Proporción de la fórmula de referencia 500 : 100 : 100 g. Pesar siempre en gramos.</p>`;
    return;
  }
  if(document.getElementById("tur-circ")){ simTur(); return; }
  const g=Math.max(1,+document.getElementById("ngr").value||20);
  const paradas=[["Recepción y charla de seguridad",10],["Parada 1: cartelería interpretativa",15],["Parada 2: flora y paisaje",15],["Parada 3: reloj solar y mural (propuesta)",15],["Cierre, preguntas y encuesta de satisfacción",10]];
  let t=9*60, filas="";
  paradas.forEach(([nom,min])=>{ const h=String(Math.floor(t/60)).padStart(2,"0"), mm=String(t%60).padStart(2,"0"); filas+=`<tr><td>${h}:${mm}</td><td>${nom}</td><td>${min} min</td></tr>`; t+=min; });
  const total=paradas.reduce((s,x)=>s+x[1],0);
  el.innerHTML=`<table><tr><th>Horario simulado</th><th>Actividad</th><th>Duración</th></tr>${filas}</table>
    <p><b>Duración total:</b> ${total} min. <b>Guías sugeridos:</b> ${Math.ceil(g/15)} (criterio de 1 guía cada 15 personas, a validar en la salida piloto).</p>`;
}

/* ---------- Animación de la simulación ---------- */
let animTimer = null, animIdx = 0;
const PASOS_TUR = ["Recepción y charla de seguridad","Parada 1: cartelería interpretativa","Parada 2: flora y paisaje","Parada 3: reloj solar y mural (propuesta)","Cierre, preguntas y encuesta de satisfacción"];
function animSteps(){ return proy==="cosmetica" ? P.cosmetica.proceso : PASOS_TUR; }
function animInit(){
  clearInterval(animTimer); animTimer = null; animIdx = 0;
  const el = document.getElementById("anim"); if(!el) return;
  const est = proy==="cosmetica"
    ? "Duración orientativa: elaboración en un día, más 1 semana de maceración y 2 de reposo del oleato."
    : "Recorrido guiado en una sola jornada. Los tiempos se ajustan en la salida piloto.";
  el.innerHTML = `<div class="anim-ctrl noprint"><button class="btn-imp" id="anim-play">Reproducir</button><button class="btn-imp" id="anim-reset">Reiniciar</button></div>
    <div class="anim-track">${animSteps().map((s,i)=>`<div class="anim-paso" data-i="${i}"><span class="num">${i+1}</span>${s}</div>`).join("")}</div>
    <div class="anim-barra"><div id="anim-bar"></div></div>
    <p class="nota" id="anim-msg"></p><p class="nota">${est}</p>`;
  document.getElementById("anim-play").onclick = animToggle;
  document.getElementById("anim-reset").onclick = animReset;
  document.querySelectorAll(".anim-paso").forEach(p=>p.onclick=()=>{ animIdx = +p.dataset.i; animPaint(); });
  animPaint();
}
function animPaint(){
  const pasos = animSteps(), n = pasos.length;
  const el = document.getElementById("anim-bar"); if(!el){ clearInterval(animTimer); animTimer=null; return; }
  document.querySelectorAll(".anim-paso").forEach((p,i)=>{ p.classList.toggle("hecho", i<animIdx); p.classList.toggle("activo-anim", i===animIdx); });
  el.style.width = (animIdx/n*100)+"%";
  document.getElementById("anim-msg").textContent = animIdx<n ? "Paso actual: "+pasos[animIdx] : "Proceso completo. Reinicia para repetir.";
}
function animToggle(){
  const btn = document.getElementById("anim-play");
  if(animTimer){ clearInterval(animTimer); animTimer=null; btn.textContent="Reproducir"; return; }
  const n = animSteps().length;
  if(animIdx>=n) animIdx = 0;
  btn.textContent = "Pausar";
  animPaint();
  animTimer = setInterval(()=>{
    animIdx++; animPaint();
    if(animIdx>=n){ clearInterval(animTimer); animTimer=null; btn.textContent="Reproducir"; }
  }, 1800);
}
function animReset(){
  clearInterval(animTimer); animTimer=null; animIdx=0;
  const b = document.getElementById("anim-play"); if(b) b.textContent="Reproducir";
  animPaint();
}

function ftoDescargar(i){
  const html = '<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>table{border-collapse:collapse;width:100%;margin-bottom:12px}td,th{border:1px solid #000;padding:4px;font-size:10pt;vertical-align:top;text-align:left}th{background:#e4eedb}</style></head><body>' + ftoHTML(i) + '</body></html>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff', html], {type:'application/msword'}));
  a.download = (proy==="turismo" ? 'FTO_ST_' : 'FTO_CRE_') + String(i+1).padStart(2,'0') + '.doc';
  a.click();
}

let cosIdx = 0, cosTimer = null;
function cosPaint(){
  const pasos = P.cosmetica.proceso;
  const sc = document.getElementById('escena');
  if(sc) sc.innerHTML = `<svg viewBox="0 0 240 150" role="img" aria-label="${pasos[cosIdx]}">${BGESC}${ICO[cosIdx]}</svg>`;
  document.querySelectorAll('#cos-lista .anim-paso').forEach((p,i)=>{ p.classList.toggle('hecho', i<cosIdx); p.classList.toggle('activo-anim', i===cosIdx); });
  const b = document.getElementById('anim-bar'); if(b) b.style.width = ((cosIdx+1)/pasos.length*100)+'%';
  const m = document.getElementById('cos-msg'); if(m) m.textContent = 'Etapa ' + (cosIdx+1) + ' de ' + pasos.length + ': ' + pasos[cosIdx];
  const fp = document.getElementById('fto-panel');
  if(fp) fp.innerHTML = `<div class="noprint"><button class="btn-imp" onclick='ftoDescargar(${cosIdx})'>Descargar esta FTO (Word)</button> <button class="btn-imp" onclick='window.print()'>Imprimir FTO</button></div>` + ftoHTML(cosIdx);
}
function cosToggle(){
  const b = document.getElementById('cos-play');
  if(cosTimer){ clearInterval(cosTimer); cosTimer = null; b.textContent = 'Reproducir'; return; }
  if(cosIdx >= P.cosmetica.proceso.length-1) cosIdx = 0;
  b.textContent = 'Pausar';
  cosPaint();
  cosTimer = setInterval(()=>{
    if(cosIdx >= P.cosmetica.proceso.length-1){ clearInterval(cosTimer); cosTimer = null; b.textContent = 'Reproducir'; return; }
    cosIdx++; cosPaint();
  }, 2200);
}
function cosReset(){
  clearInterval(cosTimer); cosTimer = null; cosIdx = 0;
  const b = document.getElementById('cos-play'); if(b) b.textContent = 'Reproducir';
  cosPaint();
}
function cosInit(){
  clearInterval(cosTimer); cosTimer = null; cosIdx = 0;
  const L = document.getElementById('cos-lista'); if(!L) return;
  L.innerHTML = '<div class="anim-track">' + P.cosmetica.proceso.map((s,i)=>`<div class="anim-paso" data-i="${i}"><span class="num">${i+1}</span>${s}</div>`).join('') + '</div>';
  L.querySelectorAll('.anim-paso').forEach(p=>p.onclick = ()=>{ cosIdx = +p.dataset.i; cosPaint(); });
  document.getElementById('cos-play').onclick = cosToggle;
  document.getElementById('cos-reset').onclick = cosReset;
  cosPaint();
}

function render(){
  clearInterval(animTimer); animTimer = null;
  const p = P[proy];
  document.body.classList.toggle("turismo", tab === "detalle" && proy === "turismo");
  document.body.classList.toggle("comun", COMUN.includes(tab));
  document.body.classList.toggle("dividida", tab === "proyectos");
  document.querySelectorAll("#tabs button[data-tab]").forEach(b=>b.classList.toggle("activa", b.dataset.tab===tab || (tab==="detalle" && b.dataset.tab==="proyectos")));
  const fn = TABS[tab];
  const cont = document.getElementById("contenido");
  cont.innerHTML = tab==="galeria" ? TABS.galeria(P.cosmetica)+TABS.galeria(P.turismo) : (fn.length ? fn(p) : fn());

/* ---------- Navegación con fade rápido entre ventanas ---------- */
let pend = null, navTimer = null;
function aplicar(){
  tab = pend.tab; proy = pend.proy; sub = pend.sub; pend = null;
  render();
  const cont = document.getElementById("contenido");
  requestAnimationFrame(()=>requestAnimationFrame(()=>cont.classList.remove("saliendo")));
}
function ir(cambios){
  const nuevo = Object.assign({tab, proy, sub}, pend || {}, cambios);
  if(!pend && nuevo.tab===tab && nuevo.proy===proy && nuevo.sub===sub) return;
  pend = nuevo;
  clearTimeout(navTimer);
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){ aplicar(); return; }
  document.getElementById("contenido").classList.add("saliendo");
  navTimer = setTimeout(aplicar, 130);
}

const dd = document.getElementById("dd-proy");
dd.addEventListener("mouseleave", ()=>dd.classList.remove("cerrado"));

document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]");
  if(g){
    e.preventDefault();
    const [t, pr, s] = g.dataset.go.split("|");
    ir(Object.assign({tab:t, sub:s || null}, pr ? {proy:pr} : {}));
    if(g.closest(".dd")){ dd.classList.add("cerrado"); if(e.detail) g.blur(); }
    return;
  }
  const b = e.target.closest("#tabs button[data-tab]");
  if(b){
    ir({tab:b.dataset.tab, sub:null});
    if(b.closest(".dd")){ dd.classList.add("cerrado"); if(e.detail) b.blur(); }
  }
});
document.addEventListener("keydown", e=>{
  if((e.key==="Enter" || e.key===" ") && e.target.matches && e.target.matches("[data-go][role=link]")){ e.preventDefault(); e.target.click(); }
});

const tblT = (hd,rows,cls) => `<div class="tscroll"><table${cls?` class="${cls}"`:""}><tr>${hd.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`;

const hhmm = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const nprCls = v => v>=200 ? "npr-i" : v>=100 ? "npr-m" : "npr-a";

/* ====================== Simulación del servicio ====================== */
function simTurHTML(){
  return `
    <span class="tag">Proyecto B</span>
    <h1 class="t">Simulación del servicio del circuito</h1>
    <p>Simulá una salida con los estándares de la <b>ET-ST-01</b>: tamaño de grupo de ${STD.nMin} a ${STD.nMax} personas por guía, ciclo de ${STD.tNom} ± ${STD.tTol} min, agua ≥ ${STD.aguaMl} ml por persona y suspensión con viento ≥ ${STD.vMax} km/h o temperatura ≥ ${STD.tMax} °C.</p>
    <div class="sim-in noprint">
      <label>Circuito: <select id="tur-circ">
        <option value="renacer">Circuito Renacer</option>
        <option value="sanjose">Circuito San José</option>
        <option value="telteca">Propuesta Telteca</option></select></label>
      <label>Turno: <select id="tur-turno"><option value="570">Mañana 09:30</option><option value="1020">Media tarde 17:00</option></select></label>
      <label>Personas: <input id="ngr" type="number" min="1" value="20"></label>
      <label>Temperatura (°C): <input id="tur-temp" type="number" value="31"></label>
      <label>Viento (km/h): <input id="tur-viento" type="number" value="20"></label>
      <label>Agua disponible (L): <input id="tur-agua" type="number" step="0.5" value="6"></label>
    </div>
    <div id="simout"></div>
    <h2>Animación del recorrido</h2>
    <div id="tur-anim"></div>`;
}
function simTur(){
  const el=document.getElementById("simout"); if(!el) return;
  turCirc = document.getElementById("tur-circ").value;
  const C = CIRCUITOS[turCirc];
  const g = Math.max(1, Math.round(+document.getElementById("ngr").value||1));
  const t0 = +document.getElementById("tur-turno").value;
  const temp = +document.getElementById("tur-temp").value;
  const vto = +document.getElementById("tur-viento").value;
  const agua = +document.getElementById("tur-agua").value;
  const guias = Math.ceil(g/STD.nMax), sub = Math.ceil(g/guias);
  const aguaReq = (g+guias)*STD.aguaMl/1000;
  const clima = temp < STD.tMax && vto < STD.vMax;
  const hidr = agua >= aguaReq;
  let t=t0, filas="";
  C.paradas.forEach(([nom,min,nota])=>{ filas+=`<tr><td>${hhmm(t)}</td><td>${nom}</td><td>${min} min</td><td class="nota">${nota||""}</td></tr>`; t+=min; });
  const total=C.paradas.reduce((s,x)=>s+x[1],0);
  const enStd = total>=STD.tNom-STD.tTol && total<=STD.tNom+STD.tTol;
  const fin = t0===570 ? 660 : 1110;
  const ok = (b,si,no) => `<span class="${b?"ok":"no"}">${b?"✔ "+si:"✖ "+no}</span>`;
  const libera = clima && hidr;
  el.innerHTML = `<p class="lead" style="margin:6px 0"><b>${C.nombre}</b> · <span class="nota">${C.estado}</span></p>
    ${tblT(["Horario","Actividad","Duración","Control"],[])}`.replace("</table></div>","")+filas+`</table></div>
    <div class="kpis">
      <div class="kpi"><b>${total} min</b><span>Duración total · fin ${hhmm(t)}</span></div>
      <div class="kpi"><b>${guias}</b><span>Guías (${guias>1?guias+" subgrupos de hasta "+sub:"1 grupo"})</span></div>
      <div class="kpi"><b>${aguaReq.toFixed(1)} L</b><span>Agua requerida (${g} visitantes + ${guias} guías)</span></div>
      <div class="kpi ${libera?"kpi-ok":"kpi-no"}"><b>${libera?"PASO":"NO PASO"}</b><span>Liberación de la salida (PCC-1)</span></div>
    </div>
    <ul class="checks">
      <li>${ok(clima,`Clima apto (${temp} °C, ${vto} km/h)`,`Suspender: ${temp>=STD.tMax?"temperatura ≥ 38 °C ":""}${vto>=STD.vMax?"viento ≥ 50 km/h (Zonda)":""} — aplicar protocolo de contingencias climáticas`)}</li>
      <li>${ok(hidr,`Agua suficiente (${agua} L ≥ ${aguaReq.toFixed(1)} L)`,`Faltan ${(aguaReq-agua).toFixed(1)} L de agua: reponer antes de salir`)}</li>
      <li>${ok(g<=STD.nMax,`Grupo dentro del cupo (${g} ≤ 15)`,`${g} personas: dividir en ${guias} subgrupos con un guía cada uno`)}</li>
      ${g<STD.nMin?`<li><span class="parcial">⚠ Grupo menor al mínimo de ${STD.nMin} personas: evaluar unirlo a otro turno</span></li>`:""}
      <li>${ok(enStd,`Ciclo dentro de ${STD.tNom} ± ${STD.tTol} min`,`Ciclo de ${total} min fuera del estándar del Renacer (${STD.tNom-STD.tTol}–${STD.tNom+STD.tTol} min): se rige por su propio tiempo estándar`)}</li>
      <li>${ok(t<=fin,`Termina dentro de la ventana operativa (hasta ${hhmm(fin)})`,`Termina a las ${hhmm(t)}, fuera de la ventana operativa (hasta ${hhmm(fin)})`)}</li>
    </ul>
    <p class="nota">Tiempos por parada del tiempo estándar inicial. Se ajustan con las planillas R-ST-05 de las salidas piloto.</p>`;
  turAnimInit();
}

/* Animación con mapa esquemático del recorrido */
let turTimer=null, turIdx=0;
const POS_REN = [[50,128],[105,92],[150,58],[250,44],[322,112],[200,140],[60,132]];
function turPos(i,n){
  if(turCirc==="renacer") return POS_REN[i];
  const a = Math.PI + i/(n-1)*Math.PI*1.7;
  return [190+140*Math.cos(a), 92+56*Math.sin(a)];
}
function turAnimInit(){
  clearInterval(turTimer); turTimer=null; turIdx=0;
  const el=document.getElementById("tur-anim"); if(!el) return;
  const P0 = CIRCUITOS[turCirc].paradas, n=P0.length;
  const pts = P0.map((_,i)=>turPos(i,n));
  const ruta = "M"+pts.map(p=>p.join(",")).join(" L");
  const lbl = turCirc==="renacer" ? ["Escuela","","A · Flora","B · Estación","C · Taller","",""] : P0.map((_,i)=>String(i+1));
  el.innerHTML = `<div class="escena"><svg id="tur-svg" viewBox="0 0 380 170" role="img" aria-label="Mapa esquemático del recorrido">
      <rect width="380" height="170" rx="12" fill="#ffe8cd"/>
      <path d="M0,150 Q90,120 190,150 T380,140 V170 H0 Z" fill="#ffd19b" opacity=".7"/>
      ${turCirc==="renacer" ? `<g class="sway"><circle cx="140" cy="38" r="9" fill="#6A9624"/><circle cx="168" cy="70" r="7" fill="#4A6B1F"/></g>
        <rect x="236" y="20" width="30" height="16" fill="#af5700"/><path d="M232,20 L250,10 L270,20 Z" fill="#8a4500"/>
        <rect x="312" y="122" width="22" height="16" fill="#c06500"/><rect x="34" y="112" width="34" height="22" fill="#8a4500"/>` : ""}
      <path d="${ruta}" fill="none" stroke="#af5700" stroke-width="3" stroke-dasharray="6 5"/>
      ${pts.map((p,i)=>`<g><circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#fff" stroke="#af5700" stroke-width="2"/>${lbl[i]?`<text x="${p[0]}" y="${p[1]-11}" font-size="10" text-anchor="middle" fill="#4a2500" font-family="Arial">${lbl[i]}</text>`:""}</g>`).join("")}
      <g id="tur-dot" style="transition:transform .9s ease"><circle r="9" fill="#e48200" stroke="#fff" stroke-width="2"/><text y="4" font-size="10" text-anchor="middle" fill="#fff" font-family="Arial">●</text></g>
    </svg></div>
    <div class="anim-ctrl noprint"><button class="btn-imp" id="tur-play">Reproducir</button><button class="btn-imp" id="tur-reset">Reiniciar</button></div>
    <div class="anim-track">${P0.map((s,i)=>`<div class="anim-paso" data-i="${i}"><span class="num">${i+1}</span>${s[0]} <span class="nota">(${s[1]} min)</span></div>`).join("")}</div>
    <div class="anim-barra"><div id="tur-bar" style="height:100%;width:0;background:var(--acc);transition:width .5s"></div></div>
    <p class="nota" id="tur-msg"></p>`;
  document.getElementById("tur-play").onclick=turToggle;
  document.getElementById("tur-reset").onclick=()=>{ clearInterval(turTimer); turTimer=null; turIdx=0; document.getElementById("tur-play").textContent="Reproducir"; turPaint(); };
  el.querySelectorAll(".anim-paso").forEach(p=>p.onclick=()=>{ turIdx=+p.dataset.i; turPaint(); });
  turPaint();
}
function turPaint(){
  const P0=CIRCUITOS[turCirc].paradas, n=P0.length;
  const d=document.getElementById("tur-dot"); if(!d){ clearInterval(turTimer); turTimer=null; return; }
  const p=turPos(Math.min(turIdx,n-1),n);
  d.setAttribute("transform",`translate(${p[0]},${p[1]})`); d.style.transform=`translate(${p[0]}px,${p[1]}px)`;
  document.querySelectorAll("#tur-anim .anim-paso").forEach((x,i)=>{ x.classList.toggle("hecho",i<turIdx); x.classList.toggle("activo-anim",i===turIdx); });
  const acum = P0.slice(0,turIdx+1).reduce((s,x)=>s+x[1],0), tot=P0.reduce((s,x)=>s+x[1],0);
  document.getElementById("tur-bar").style.width=(acum/tot*100)+"%";
  document.getElementById("tur-msg").textContent=`Paso ${turIdx+1} de ${n}: ${P0[turIdx][0]} · minuto acumulado ${acum} de ${tot}${P0[turIdx][2]?" · "+P0[turIdx][2]:""}`;
  const fp=document.getElementById("fto-panel");
  if(fp && turCirc==="renacer"){ const map=[3,4,4,4,4,5,5]; ftoTurPaint(map[turIdx]); }
}
function turToggle(){
  const b=document.getElementById("tur-play"), n=CIRCUITOS[turCirc].paradas.length;
  if(turTimer){ clearInterval(turTimer); turTimer=null; b.textContent="Reproducir"; return; }
  if(turIdx>=n-1) turIdx=0;
  b.textContent="Pausar"; turPaint();
  turTimer=setInterval(()=>{ if(turIdx>=n-1){ clearInterval(turTimer); turTimer=null; b.textContent="Reproducir"; return; } turIdx++; turPaint(); },1700);
}

function costosCalc(){
  const tb=document.getElementById("c-tab"); if(!tb) return;
  const v=[...tb.querySelectorAll("input")].map(x=>+x.value||0);
  const cats=["Prevención","Evaluación","Fallas internas","Fallas externas"], tot=[{},{}];
  COSTOS.forEach((c,i)=>{ [0,1].forEach(k=>{ tot[k][c[0]]=(tot[k][c[0]]||0)+v[i*2+k]; }); });
  const T=[0,1].map(k=>cats.reduce((s,c)=>s+(tot[k][c]||0),0));
  const fmt=n=>"$ "+Math.round(n).toLocaleString("es-AR");
  const rows=cats.map(c=>[c,fmt(tot[0][c]||0),(T[0]?(tot[0][c]/T[0]*100):0).toFixed(1)+" %",fmt(tot[1][c]||0),(T[1]?(tot[1][c]/T[1]*100):0).toFixed(1)+" %"]);
  rows.push(["<b>Total</b>","<b>"+fmt(T[0])+"</b>","100 %","<b>"+fmt(T[1])+"</b>","100 %"]);
  const f0=(tot[0]["Fallas internas"]||0)+(tot[0]["Fallas externas"]||0), f1=(tot[1]["Fallas internas"]||0)+(tot[1]["Fallas externas"]||0);
  const max=Math.max(...cats.map(c=>Math.max(tot[0][c]||0,tot[1][c]||0)),1);
  const barras=cats.map(c=>`<div class="barra-f"><span>${c}</span><div><i style="width:${(tot[0][c]||0)/max*100}%"></i><i class="b2" style="width:${(tot[1][c]||0)/max*100}%"></i></div></div>`).join("");
  document.getElementById("c-out").innerHTML = tblT(["Categoría","Temporada 1","% del total","Temporada 2","% del total"],rows)+
    `<div class="leyenda"><span class="l1"></span> Temporada 1 (piloto) <span class="l2"></span> Temporada 2 (con acciones)</div>${barras}
     <div class="kpis"><div class="kpi"><b>${fmt(T[0]-T[1])}</b><span>Variación del costo total de calidad</span></div>
     <div class="kpi ${f0&&f1<=f0*0.5?"kpi-ok":"kpi-no"}"><b>${f0?((1-f1/f0)*100).toFixed(0):0} %</b><span>Reducción de costos de no calidad (objetivo ≥ 50 %)</span></div></div>`;
}

/* Gráfico de líneas simple en SVG (series: [[nombre, valores, color]]) */
function lineasSVG(xs, series, yLabel, limites){
  const W=640, H=240, l=48, r=96, t=14, b=30;
  const all = series.flatMap(s=>s[1]).concat((limites||[]).map(x=>x[0]));
  let lo=Math.min(...all), hi=Math.max(...all);
  const raw=(hi-lo)/4||1, mag=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,2.5,5,10].map(m=>m*mag).find(x=>x>=raw);
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step; if(lo<0 && Math.min(...all)>=0) lo=0;
  const nT=Math.round((hi-lo)/step);
  const X=i=>l+i*(W-l-r)/(xs.length-1), Y=v=>t+(hi-v)*(H-t-b)/(hi-lo);
  let g="";
  for(let k=0;k<=nT;k++){ const v=lo+step*k; g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ddd"/><text x="${l-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#555">${(+v.toFixed(2)).toLocaleString("es-AR")}</text>`; }
  xs.forEach((x,i)=>{ g+=`<text x="${X(i)}" y="${H-10}" font-size="10" text-anchor="middle" fill="#555">${x}</text>`; });
  (limites||[]).forEach(([v,n,c])=>{ g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="5 4"/><text x="${W-r+4}" y="${Y(v)+4}" font-size="10" fill="${c}">${n}</text>`; });
  series.forEach(([n,v,c])=>{ g+=`<polyline fill="none" stroke="${c}" stroke-width="2.2" points="${v.map((y,i)=>X(i)+","+Y(y)).join(" ")}"/>`+v.map((y,i)=>`<circle cx="${X(i)}" cy="${Y(y)}" r="3.4" fill="${c}"><title>${n}: ${y}</title></circle>`).join(""); });
  const ley = series.length>1 ? `<div class="leyenda">${series.map(s=>`<span style="background:${s[2]}"></span>${s[0]}`).join(" ")}</div>` : "";
  return `<div class="tscroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;background:#fff;border:1px solid var(--borde);border-radius:8px" role="img" aria-label="${yLabel}"><text x="12" y="${H/2}" font-size="10" fill="#555" transform="rotate(-90 12 ${H/2})" text-anchor="middle">${yLabel}</text>${g}</svg></div>${ley}`;
}
function cartaSVG(v, lbl, lim){ return lineasSVG(v.map((_,i)=>i+1), [[lbl, v, "#2E5D8A"]], lbl, lim); }

    <p>El procedimiento P-ST-01 se ejecuta en tres fases: <b>previa</b> (auditoría de baños y recepción, clima, R-ST-03 y PCC-1), <b>ejecutiva</b> (conteo, charla, caminata cronometrada, QR, PCC-2, encuesta y R-ST-05) y <b>documental</b> (entrega de registros, carga en la nube por Año / Mes / Circuito, archivo de originales por 5 años y PCC-3). Los proveedores de agua deben tener habilitación bromatológica y los insumos del botiquín, vencimiento mayor a 60 días al recibirlos.</p>
    <h3>Capacidad del proceso de guiado</h3>
    <div class="kpis"><div class="kpi"><b>μ = 81 min</b><span>Media de 120 visitas (S = 4 min)</span></div><div class="kpi kpi-ok"><b>Cp = 1,25</b><span>(95 − 65) / (6 × 4)</span></div><div class="kpi kpi-ok"><b>Cpk = 1,17</b><span>mín(1,17 ; 1,33)</span></div><div class="kpi"><b>69 a 93 min</b><span>μ ± 3σ, dentro de 65 a 95</span></div></div>

    <p>La ISO 9001:2015 no exige una metodología específica, pero promueve el pensamiento basado en riesgos. El AMFE se implementa para cumplir con <b>6.1.1 y 6.1.2</b> (riesgos y oportunidades), <b>4.4.1 f</b> (riesgos en cada proceso), <b>8.5.1 g</b> (prevención de errores humanos) y <b>9.1.3 e</b> (eficacia de las acciones).</p>

    <li><b>Responsabilidades:</b> el docente a cargo aprueba el AMFE y audita las acciones; los estudiantes guías identifican fallos, los reportan y aplican los controles.</li>

      ["7","Interrupción parcial o reclamo formal","1 en 10","Difícil de advertir antes de afectar al cliente"],
      ["8","Pérdida total de conformidad o incumplimiento normativo crítico","1 en 5","El control casi nunca la advierte antes de la queja"],
      ["9","Riesgo grave para la salud sin lesiones permanentes","1 en 2","Detección casi nula antes del impacto"],
      ["10","Accidente grave o emergencia climática sin evacuación","&gt; 50 % de los turnos","Sin control: llega al cliente"]])+`</details>
    <div class="anim-ctrl noprint"><button class="btn-imp" id="amfe-ren">AMFE Circuito Renacer (adaptado)</button><button class="btn-imp" id="amfe-sj">AMFE Circuito San José (original)</button></div>
    <div id="amfe-out"></div>`;

  case "sig": return hT("Sistema Integrado de Gestión: contingencia climática")+`
    <h2>Situación problemática</h2>`+tblT(["Proceso","Situación","Consecuencia"],[["Prestación del servicio turístico","Durante el circuito ocurre una contingencia climática (lluvia intensa, viento Zonda o vientos fuertes) que provoca anegamiento o deterioro de caminos, caída de ramas, obstáculos o imposibilidad de acceder a puntos del circuito.","Riesgo para alumnos, docentes y visitantes; interrupción o demora del circuito; actividades incumplidas; menor satisfacción; impactos sobre suelo, flora, fauna y paisaje."]])+`
    <h2>Análisis desde las tres normas</h2>`+tblT(["","Calidad · ISO 9001","Ambiente · ISO 14001","SST · ISO 45001"],[
      ["<b>Relación</b>","El deterioro de caminos o la imposibilidad de acceder a paradas impide prestar el circuito según lo planificado y afecta la conformidad y la satisfacción.","El fenómeno modifica el entorno; una mala respuesta genera nuevos impactos (tránsito por zonas no previstas, residuos).","Caminos resbaladizos, caída de ramas y baja visibilidad aumentan el riesgo de accidentes."],
      ["<b>Control propuesto</b>","Criterios para continuar, modificar, reprogramar o suspender; comunicar cambios y registrar contingencias.","Evaluar el recorrido tras la contingencia, evitar sectores sensibles, definir recorridos alternativos y controlar residuos.","Protocolo de actuación: monitoreo meteorológico, evaluación de peligros, criterios de suspensión, comunicación de emergencias y elementos de protección."]])+`
    <h2>Propuesta de mejora</h2>`+tblT(["Elemento","Propuesta"],[
      ["Acción / control","Protocolo de Actuación ante Contingencias Climáticas: verificar clima y estado del recorrido antes de cada salida, con criterios para continuar, modificar, reprogramar o suspender."],
      ["Responsable","Responsable del Circuito Turístico y docente acompañante, con el responsable de Higiene y Seguridad."],
      ["Documento o registro","Protocolo de contingencias, Lista de Verificación Previa del Circuito (R-ST-03) y Registro de Contingencias Climáticas (R-ST-07)."],
      ["Verificación","Comprobar que cada salida tenga su lista de verificación y que las contingencias se registren y gestionen; evaluar si se protegió a las personas, se mantuvo la conformidad y se evitaron impactos."]])+`
    <h2>Árbol de decisión del protocolo</h2>
    <ol class="arbol"><li><b>¿Viento ≥ 50 km/h o T ≥ 38 °C?</b> Sí → suspender y reprogramar (R-ST-07).</li><li><b>¿Lluvia en las últimas 24 h?</b> Sí → control pos lluvia del sendero; si hay anegamiento, recorrido alternativo por la vereda de la plaza.</li><li><b>¿Ramas caídas o chapas sueltas en la estación?</b> Sí → cerrar el hito B y comunicar el cambio al grupo.</li><li><b>Durante el recorrido cambia el clima:</b> regreso inmediato a la escuela por el tramo más corto, conteo del grupo y registro.</li></ol>`;

  case "impactos": {
    const cols=["Agua subterránea","Calidad del aire","Olores","Nivel sonoro","Superficie intervenida","Calidad del suelo","Flora y fauna","Paisaje","Tránsito y transporte","Economía local","Empleo","Identidad y cultura Huarpe","Escuela Raíces Huarpes","Residuos","Redes de servicio"];
    const L="DEFGHIJKLMNOPQR";
    const fila=(pos,neg)=>{const r=Array(15).fill("");[...pos].forEach(c=>r[L.indexOf(c)]="P");[...neg].forEach(c=>r[L.indexOf(c)]="N");return r;};
    const nP=IMPACTOS.reduce((s,x)=>s+x[2].length,0), nN=IMPACTOS.reduce((s,x)=>s+x[3].length,0);
    return hT("Matriz de impactos sociales y ambientales")+`
    <p>Cruza cada proceso del Mapa General con los factores del medio natural, perceptivo, socioeconómico y cultural, y de infraestructura. <span class="ok">P</span> = impacto positivo · <span class="no">N</span> = impacto negativo.</p>
    <div class="kpis"><div class="kpi kpi-ok"><b>${nP}</b><span>Impactos positivos</span></div><div class="kpi kpi-no"><b>${nN}</b><span>Impactos negativos</span></div></div>
    <div class="tscroll"><table class="imp"><tr><th>Tipo</th><th>Proceso</th>${cols.map(c=>`<th class="vert"><span>${c}</span></th>`).join("")}</tr>
    ${IMPACTOS.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td>${fila(x[2],x[3]).map(v=>`<td class="${v==="P"?"ip":v==="N"?"in":""}">${v}</td>`).join("")}</tr>`).join("")}</table></div>
    <ul><li><b>Positivos:</b> economía local, empleo, identidad y cultura Huarpe y la propia escuela, en todos los procesos; los estratégicos además favorecen flora, fauna y paisaje.</li>
    <li><b>Negativos:</b> sobre todo en procesos operativos y de soporte: aire, ruido, flora y fauna, paisaje, tránsito y residuos, por el traslado y la circulación de visitantes.</li>
    <li><b>Gestión:</b> grupos de 5 a 15 por guía, sendero delimitado, inspecciones previas, gestión de residuos y recorridos alternativos tras una contingencia.</li></ul>`;}

  case "auditoria": return hT("Auditoría interna")+`
    <p>Auditoría cruzada entre equipos de la cátedra (ISO 9001, cláusula 9.2): el equipo del servicio turístico auditó a otro equipo y, a su vez, fue auditado.</p>
    <h2>Como equipo auditor</h2>`+tblT(["Dato","Detalle"],[["Tipo","Auditoría interna de primera parte"],["Equipo auditado","Grupo N° 5 (organización industrial: estación meteorológica en el plan; ensayo de probetas y dosificación de hormigón en el informe)"],["Criterios","ISO 9001:2015 y documentación interna (procedimientos, especificaciones técnicas, mapas, gestión de riesgos)"],["Duración","1 h 30 min"]])+`
    <h3>Plan de auditoría</h3>`+tblT(["Horario","Actividad","Contenido"],[
      ["10:00 – 10:10","Reunión de apertura","Presentación, alcance, objetivos, criterios y metodología"],
      ["10:10 – 10:25","Sistema de gestión y planificación","Mapa de procesos, diagrama de flujo y objetivos de calidad"],
      ["10:25 – 10:45","Recursos, competencia y control operacional","Procedimiento estandarizado y especificación técnica"],
      ["10:45 – 11:05","Riesgos, desempeño y mejora","AMFE, variables de control y costos de calidad"],
      ["11:05 – 11:20","Deliberación del equipo auditor","Clasificación de hallazgos en C y NC"],
      ["11:20 – 11:30","Reunión de cierre","Resultados y plazos para el plan de acción"]])+`
    <h3>Resultados del informe</h3>`+tblT(["Tipo","Requisito","Hallazgo"],[
      ["<span class='ok'>C</span>","4.4","Mapa de procesos documentado"],["<span class='ok'>C</span>","8.4","Matriz de evaluación de proveedores con criterios"],
      ["<span class='ok'>C</span>","7.1 y 7.2","Responsabilidades, autoridades y competencias por proceso"],["<span class='ok'>C</span>","8.1","Control de calibración y de peso; especificaciones documentadas"],
      ["<span class='no'>NC 001</span>","6.2","No se encuentran objetivos de calidad identificados"],["<span class='no'>NC 002</span>","9.1","No se documenta la frecuencia ni el motivo de los ensayos"],
      ["<span class='no'>NC 003</span>","9.1","Costos identificados pero no cuantificados ni evaluados"]])+`
    <h2>Como equipo auditado</h2>`+tblT(["Dato","Detalle"],[["Equipo auditor","Grupo N° 7"],["Fecha de auditoría","14/10/2026"],["Fecha de respuesta","26/10/2026"],["Resultado","3 no conformidades y 5 conformidades"]])+`
    <p><b>Conformidades que se mantienen:</b> gestión de un riesgo del AMFE (Zonda) con acción y responsable (8.1.2), registros de la visita y su almacenamiento (7.5), recepción de consultas (8.2.1), ID de visita y trazabilidad (8.5.2) y encuesta de satisfacción (9.1.2).</p>`+
    tblT(["NC","Requisito","Hallazgo","Causa raíz","Acción correctiva","Responsable","Fecha","Eficacia"],[
      ["NC-03","8.5.1","El guión con paradas y tiempos está planificado pero no implementado","El procedimiento no se capacitó ni se verificó","Capacitar en el guión; registrar tiempos en R-ST-05 y controlar en el PCC-2; revisión del Guía Líder tras cada visita","Guía Líder / Encargado de Campo","06/11/2026","R-ST-05 completas y ciclo de 80 ± 15 min"],
      ["NC-01","7.2","No hay evidencia de capacitación del guía","Preparación informal, sin perfil ni registro","Perfil de competencia en P-ST-01; programa breve con evaluación práctica; registro de capacitación","Guía Líder con docentes","13/11/2026","100 % de guías capacitados y evaluados"],
      ["NC-02","7.5","Sin control de acceso, versiones ni conservación de registros","Registros dispersos (Forms, Excel, correo, nube y papel)","Lista maestra con código y versión; permisos por rol; plazo de conservación; cargar consultas de WhatsApp","Responsable Documental","20/11/2026","Lista maestra aprobada y permisos aplicados"]])+`
    <p class="nota">Seguimiento: se solicitó al equipo auditor verificar la eficacia de las acciones una vez cumplidas las fechas del plan.</p>`;

  case "inspeccion": return hT("Plan de inspección y control del comitente (PICC)")+`
    <p class="lead">La Inspección del Comitente supervisa el servicio <b>mientras se presta</b> (aseguramiento de la calidad) y complementa el control de calidad del Contratista. Abarca recepción y sanitarios, la red de senderos, el taller de la artesana y el perímetro de la estación abandonada, en las siete etapas del servicio.</p>
    <h2>Tipos de punto de inspección</h2>
    <div class="kpis"><div class="kpi"><b>R</b><span>Revisión documental, sin detener la operación</span></div><div class="kpi kpi-m"><b>W</b><span>Testigo: el Inspector presencia la actividad</span></div><div class="kpi kpi-no"><b>H</b><span>Hold Point: no se avanza sin firma del Inspector</span></div></div>`+
    tblT(["Etapa","Control del Contratista (CC)","Verificación del Comitente (AC)","Punto"],[
      ["1. Consulta y registro","Registro con ID; fecha, circuito y guías habilitados","Auditoría semanal de ID y cupos","R"],
      ["2. Pago","Precios visibles; comprobante vinculado al ID","Auditoría de comprobantes y precios","R"],
      ["3. Preparar el servicio (PCC-1)","Sendero ≤ 2 cm; cierre ≥ 1,50 m; agua y botiquín; clima; R-ST-03","Inspección en campo y contraste con el SMN; sin su firma en “Go” no se sale","<b>H</b>"],
      ["4. Recepción y charla","Conteo por guía; charla completa según guión","Inspección sorpresa; verificación del conteo","W"],
      ["5. Caminata (PCC-2)","Guiado, cronometraje, hidratación, QR, R-ST-05","Fiscalización en la parada intermedia","W"],
      ["6. Regreso y cierre","Plenario y 100 % de encuestas","Tasa de encuestas y quejas","W"],
      ["7. Documentación (PCC-3)","Carga en la nube en ≤ 24 h bajo el ID","Auditoría semanal con R-DOC-01","R"]])+`
    <h2>Criterios de aceptación</h2>`+tblT(["Parámetro","Criterio","Instrumento","Frecuencia","Evidencia"],[
      ["Viento Zonda","&lt; 50 km/h","SMN / Defensa Civil","T − 30 min","Reporte firmado"],["Temperatura","&lt; 38 °C a la sombra","Termómetro calibrado","T − 30 min","R-ST-03"],
      ["Índice UV","≤ 8 (si &gt; 8, hidratación cada 20 min)","App oficial","T − 30 min","R-ST-03"],["Agua","≥ 2 L por persona y turno","Control volumétrico","Cada turno","R-ST-03"],
      ["Botiquín tipo A","100 % precintado y vigente","Lista de chequeo","Cada turno","R-ST-03"],["Cierre de la estación","≥ 1,50 m, continuo","Cinta métrica","Semanal","R-INF-01"],
      ["Sendero","≤ 2 cm","Regla o cinta","Diaria","R-INF-01"],["Grupo","5 a 15 por guía","Conteo","Inicio del turno","R-ST-05"],
      ["Tiempo de ciclo","80 ± 15 min","Cronómetro","Cada turno","R-ST-05"],["QR","100 % de lectura","Smartphone","Diaria","R-ST-03"],["Carga documental","100 % en ≤ 24 h","Auditoría de la nube","Semanal","R-DOC-01"]])+`
    <h2>Hallazgos y recepción del servicio</h2>`+tblT(["Hallazgo","Ejemplo","Efecto","Plazo"],[
      ["Observación","Desvío menor sin impacto","Registro","5 días hábiles"],["NC Menor","Carga documental &gt; 24 h; un QR ilegible con respaldo","Contención y plan","48 h"],
      ["NC Mayor","Partir con Zonda ≥ 50 km/h, botiquín incompleto o sin firma del PCC-1","Orden de paralización","12 h"]])+`
    <ol><li><b>Recepción provisoria:</b> documentación completa (Plan de Calidad, Plan SST, certificaciones, habilitaciones) y comprobación de senderos y cierre.</li>
    <li><b>Período de prueba:</b> 30 días o 120 visitas fiscalizadas, Cp ≥ 1,25, cero NC Mayores abiertas y 100 % de carga documental.</li>
    <li><b>Recepción definitiva:</b> acta de liberación del servicio, sujeta a auditorías periódicas.</li></ol>`;

  case "cartas": return hT("Control estadístico: capacidad y cartas de control")+`
    <p class="lead">Aplicación de las herramientas de control estadístico a un caso de servicio: una distribuidora eléctrica con dos parámetros contractuales, <b>5 cortes por cliente al mes</b> como máximo y <b>120 min</b> de duración promedio máxima.</p>
    <h2>Capacidad y desempeño (solo LSE = 120 min)</h2>
    <div class="kpis"><div class="kpi"><b>X̿ = 114,98</b><span>Media del período (min)</span></div><div class="kpi"><b>σ = 1,505</b><span>Corto plazo: R̄ / d₂ = 3,5 / 2,326</span></div><div class="kpi"><b>σ = 10,444</b><span>Largo plazo: 50 datos</span></div><div class="kpi kpi-ok"><b>Cps = 1,112</b><span>Capacidad a corto plazo</span></div><div class="kpi kpi-no"><b>Pps = 0,160</b><span>Desempeño real a largo plazo</span></div></div>
    <p>La enorme diferencia entre capacidad y desempeño indica que la media del proceso no es estable. Para que los índices predigan el futuro, el proceso debe estar bajo control estadístico.</p>
    <h2>Carta X̄–R (n = 5)</h2>`+cartaSVG(CARTA_X,"Media mensual (min)",[[117.00,"LSC 117,00","#A33224"],[114.98,"LC 114,98","#4B6B4A"],[112.96,"LIC 112,96","#A33224"],[120,"LSE 120","#D4A017"]])+
    cartaSVG(CARTA_R,"Rango mensual (min)",[[7.40,"LSC 7,40","#A33224"],[3.5,"LC 3,5","#4B6B4A"],[0,"LIC 0","#A33224"]])+`
    <ul><li><b>Carta R:</b> rangos entre 3 y 5, dentro de 0 a 7,40: la variabilidad dentro de cada mes es estable.</li>
    <li><b>Carta X̄:</b> proceso <b>extremadamente inestable</b>; solo el mes 6 queda dentro de los límites y hay una deriva ascendente durante los diez meses. Esa causa especial explica la diferencia entre Cps y Pps.</li></ul>
    <h2>Carta p: sectores con cortes excesivos (n = 50)</h2>`+cartaSVG(CARTA_P,"Proporción no conforme",[[0.195,"LSC 0,195","#A33224"],[0.08,"p̄ 0,08","#4B6B4A"],[0,"LIC 0","#A33224"]])+`
    <p>Ningún punto supera el LSC y no hay patrones: el proceso es <b>estable</b>, pero incumple el contrato de forma estructural (8 % de sectores no conformes). Un proceso puede ser estable y, a la vez, incapaz.</p>
    <h2>Aplicación al circuito turístico</h2>
    <p>El mismo razonamiento se aplica al <b>tiempo de ciclo del recorrido</b> (80 ± 15 min): con las planillas R-ST-05 se puede construir una carta X̄–R para verificar la estabilidad antes de interpretar la capacidad (Cp = 1,25; Cpk = 1,17), y una carta p con la proporción de salidas fuera de tiempo o suspendidas, para separar problemas estructurales de causas especiales como una jornada de viento Zonda.</p>`;

  default: return hT(p.nombre)+`<p class="lead">${p.subtitulo}</p><h2>Diagnóstico y requisito</h2><p>${p.diagnostico}</p><h2>Documentación del proyecto</h2><ul class="docs">${p.docs.map(d=>`<li>${d}</li>`).join("")}</ul>`;
  }
}

/* Tabla AMFE con colores de NPR */
function amfeRender(cual){
  const D = cual==="sj" ? AMFE_SJ : AMFE_REN;
  const el=document.getElementById("amfe-out"); if(!el) return;
  document.getElementById("amfe-ren").classList.toggle("sel",cual!=="sj");
  document.getElementById("amfe-sj").classList.toggle("sel",cual==="sj");
  const filas = D.map(r=>{ const n1=r[3]*r[5]*r[7], n2=r[10]*r[11]*r[12];
    return [r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7],`<span class="npr ${nprCls(n1)}">${n1}</span>`,r[8],r[9],r[10],r[11],r[12],`<span class="npr ${nprCls(n2)}">${n2}</span>`]; });
  const i0=D.filter(r=>r[3]*r[5]*r[7]>=200).length, m0=D.filter(r=>{const v=r[3]*r[5]*r[7];return v>=100&&v<200;}).length;
  const i1=D.filter(r=>r[10]*r[11]*r[12]>=200).length, m1=D.filter(r=>{const v=r[10]*r[11]*r[12];return v>=100&&v<200;}).length;
  const s0=D.reduce((s,r)=>s+r[3]*r[5]*r[7],0), s1=D.reduce((s,r)=>s+r[10]*r[11]*r[12],0);
  el.innerHTML = `<h3>${cual==="sj"?"Recorrido turístico San José · AMFE del 30/09/2026":"Circuito Renacer · adaptación del AMFE (propuesta)"}</h3>
   ${cual==="sj"?"":prop("Se reutilizan los modos de fallo comunes del AMFE de San José (clima, botiquín, sendero, QR, tiempos) y se agregan los propios de la plaza, la estación y el taller artesanal.")}
   <div class="kpis"><div class="kpi"><b>${D.length}</b><span>Modos de fallo analizados</span></div>
   <div class="kpi"><b>${i0} → ${i1}</b><span>Riesgos inaceptables (NPR ≥ 200) antes → después</span></div>
   <div class="kpi"><b>${m0} → ${m1}</b><span>Riesgos moderados antes → después</span></div>
   <div class="kpi kpi-ok"><b>${((1-s1/s0)*100).toFixed(0)} %</b><span>Reducción del NPR total</span></div></div>
   `+tblT(["Paso","Modo de fallo","Efecto","G","Causa","O","Control actual","D","NPR inicial","Acción","Responsable","G'","O'","D'","NPR final"],filas,"amfe");
}

/* Prioridades del AMFE en el panel lateral se inicializan al entrar */
function turSubInit(){
  if(sub==="amfe"){ document.getElementById("amfe-ren").onclick=()=>amfeRender("ren"); document.getElementById("amfe-sj").onclick=()=>amfeRender("sj"); amfeRender("ren"); }
  if(sub==="objetivos") indCalc();
}

render();
</script>
